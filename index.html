<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v11</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#101116;
  color:#fff;
}

body{
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Hiragino Sans",
  "Hiragino Kaku Gothic ProN",
  sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:6px 0;
  font-size:25px;
}

.sub{
  margin:0 0 18px;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

textarea{
  width:100%;
  height:180px;
  resize:vertical;

  padding:15px;

  background:#1b1d26;
  color:#fff;

  border:1px solid #555966;
  border-radius:15px;

  font-family:inherit;
  font-size:16px;
  line-height:1.55;

  outline:none;
}

textarea:focus{
  border-color:#ff82b2;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;

  min-height:48px;
  padding:8px 3px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.stage{
  position:relative;
  width:100%;
  height:390px;

  overflow:hidden;

  border:1px solid #444856;
  border-radius:18px;

  background:
  radial-gradient(
    circle at 15% 15%,
    rgba(70,78,108,.45),
    transparent 34%
  ),
  radial-gradient(
    circle at 90% 90%,
    rgba(73,46,87,.35),
    transparent 38%
  ),
  linear-gradient(
    145deg,
    #222532,
    #14151c
  );
}

.stageTitle{
  position:absolute;
  top:13px;
  left:14px;

  z-index:2;

  color:#999;
  font-size:12px;
}

canvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button{
  flex:1;

  min-height:52px;

  border:0;
  border-radius:13px;

  font-size:16px;
  font-weight:700;
}

.copy{
  background:#ff82b2;
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}

.panel{
  margin-top:16px;

  padding:16px;

  border:1px solid #343744;
  border-radius:16px;

  background:#161820;
}

.panelTitle{
  margin-bottom:8px;

  font-size:16px;
  font-weight:700;
}

.good{
  color:#86e7ac;
  font-size:13px;
}

.small{
  margin-top:9px;

  color:#8f919a;
  font-size:12px;
  line-height:1.7;
}

@media(max-width:500px){

  main{
    padding:16px;
  }

  h1{
    font-size:23px;
  }

  .stage{
    height:365px;
  }
}
</style>
</head>

<body>

<main>

<h1>✨ トピア弾幕プレビュー v11</h1>

<div class="sub">
Canvas描画＋TOPIA実機キャリブレーション
</div>

<textarea
id="code"
spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>

<div class="info">
  <span id="counter">推定：0 / 50</span>
  <span id="warning"></span>
</div>

<div class="stage" id="stage">

  <div class="stageTitle">
    TOPIA Canvas プレビュー
  </div>

  <canvas id="canvas"></canvas>

</div>

<div class="buttons">

  <button class="copy" id="copy">
    コードをコピー
  </button>

  <button class="clear" id="clear">
    クリア
  </button>

</div>

<div class="panel">

  <div class="panelTitle">
    🧪 v11 Canvasレンダラー
  </div>

  <div class="good">
    ✓ TOPIA実機補正プロファイル ON
  </div>

  <div class="small">
    HTML文字配置ではなくCanvas上へ直接描画します。
    size・color・b・i・\ua・特殊Unicodeを解析し、
    実機確認済みパターンには専用の重なり補正を適用します。
  </div>

</div>

</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const input =
document.getElementById("code");

const canvas =
document.getElementById("canvas");

const stage =
document.getElementById("stage");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");

const ctx =
canvas.getContext("2d");


/* =====================================================
   CALIBRATION DATABASE

   今後TOPIA実機スクショとの比較結果は
   基本的にここへ追加する。
===================================================== */

const calibration = {

  normal:{
    advance:0.93,
    scaleX:1,
    scaleY:1,
    x:0,
    y:0
  },

  "᭄":{
    advance:0.52,
    scaleX:0.72,
    scaleY:1.18,
    x:-9,
    y:3
  },

  "ꦿ":{
    advance:0.12,
    scaleX:0.78,
    scaleY:0.92,
    x:-27,
    y:10
  },

  "ૢ":{
    advance:0.12,
    scaleX:0.80,
    scaleY:0.92,
    x:-30,
    y:12
  },

  "₈":{
    advance:0.38,
    scaleX:0.82,
    scaleY:0.82,
    x:-13,
    y:18
  },

  "⁸":{
    advance:0.38,
    scaleX:0.82,
    scaleY:0.82,
    x:-11,
    y:-25
  },

  "⃟":{
    advance:0,
    scaleX:1.05,
    scaleY:1.05,
    x:-20,
    y:0
  },

  "꙰":{
    advance:0,
    scaleX:1,
    scaleY:1,
    x:-12,
    y:-5
  }

};


/* =====================================================
   KNOWN TOPIA PATTERNS

   単一文字補正だけでは再現しづらい
   実機確認済みクラスタを登録。
===================================================== */

const knownPatterns = [

  {
    text:"ꦿૢ₈⁸",

    chars:[
      {char:"ꦿ",x:-27,y:8,sx:.78,sy:.92},
      {char:"ૢ",x:-31,y:13,sx:.80,sy:.92},
      {char:"₈",x:-9,y:17,sx:.82,sy:.82},
      {char:"⁸",x:3,y:-25,sx:.82,sy:.82}
    ],

    advance:.70
  }

];


/* =====================================================
   COLOR
===================================================== */

function validColor(value){

  if(/^#[0-9a-f]{3}$/i.test(value)){
    return value;
  }

  if(/^#[0-9a-f]{6}$/i.test(value)){
    return value;
  }

  return "#ffffff";
}


/* =====================================================
   TOPIA LENGTH ESTIMATE
===================================================== */

function estimateLength(text){

  let total=0;

  for(const ch of Array.from(text)){

    const cp=
    ch.codePointAt(0);

    if(cp<=0x7f){
      total+=0.5;
    }
    else{
      total+=1;
    }

  }

  return Math.round(total*10)/10;
}


/* =====================================================
   PARSER
===================================================== */

function parseCode(raw){

  const tokens=[];

  let style={
    size:40,
    color:"#ffffff",
    bold:false,
    italic:false
  };

  const stack=[];

  const regex=
  /(\\ua|<\/?b>|<\/?i>|<size=([^>]+)>|<\/size>|<color=([^>]+)>|<\/color>)/gi;

  let last=0;
  let match;


  function addText(text){

    if(!text) return;

    tokens.push({
      type:"text",
      text:text,
      style:{...style}
    });

  }


  while(
    (match=regex.exec(raw))!==null
  ){

    addText(
      raw.substring(
        last,
        match.index
      )
    );

    const full=
    match[0];

    const lower=
    full.toLowerCase();


    if(lower==="\\ua"){

      tokens.push({
        type:"newline"
      });

    }


    else if(lower==="<b>"){

      stack.push({
        tag:"b",
        style:{...style}
      });

      style.bold=true;

    }


    else if(lower==="</b>"){

      restoreStyle(
        stack,
        "b",
        style
      );

    }


    else if(lower==="<i>"){

      stack.push({
        tag:"i",
        style:{...style}
      });

      style.italic=true;

    }


    else if(lower==="</i>"){

      restoreStyle(
        stack,
        "i",
        style
      );

    }


    else if(
      lower.startsWith("<size=")
    ){

      stack.push({
        tag:"size",
        style:{...style}
      });

      const n=
      parseFloat(match[2]);

      if(!isNaN(n)){
        style.size=n;
      }

    }


    else if(lower==="</size>"){

      restoreStyle(
        stack,
        "size",
        style
      );

    }


    else if(
      lower.startsWith("<color=")
    ){

      stack.push({
        tag:"color",
        style:{...style}
      });

      style.color=
      validColor(match[3]);

    }


    else if(lower==="</color>"){

      restoreStyle(
        stack,
        "color",
        style
      );

    }


    last=
    regex.lastIndex;

  }


  addText(
    raw.substring(last)
  );


  return tokens;
}


/* =====================================================
   STYLE STACK
===================================================== */

function restoreStyle(
  stack,
  tag,
  style
){

  for(
    let i=stack.length-1;
    i>=0;
    i--
  ){

    if(stack[i].tag===tag){

      const old=
      stack[i].style;

      style.size=
      old.size;

      style.color=
      old.color;

      style.bold=
      old.bold;

      style.italic=
      old.italic;

      stack.splice(i,1);

      return;
    }
  }
}


/* =====================================================
   CANVAS SETUP
===================================================== */

function setupCanvas(){

  const rect=
  stage.getBoundingClientRect();

  const dpr=
  window.devicePixelRatio || 1;

  canvas.width=
  Math.round(rect.width*dpr);

  canvas.height=
  Math.round(rect.height*dpr);

  canvas.style.width=
  rect.width+"px";

  canvas.style.height=
  rect.height+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  return {
    width:rect.width,
    height:rect.height
  };
}


/* =====================================================
   FONT
===================================================== */

function setFont(style){

  /*
    TOPIA size → Canvas px
    基準倍率
  */

  const px=
  style.size*0.80;

  let font="";

  if(style.italic){
    font+="italic ";
  }

  if(style.bold){
    font+="700 ";
  }

  font+=
  px+
  'px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif';

  ctx.font=font;

  ctx.textBaseline="alphabetic";

  ctx.textAlign="left";

  return px;
}


/* =====================================================
   SHADOW / OUTLINE
===================================================== */

function drawGlyph(
  char,
  x,
  y,
  style,
  sx=1,
  sy=1
){

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(sx,sy);

  setFont(style);

  ctx.fillStyle=
  style.color;

  /*
    TOPIAスクショで見える
    黒系シャドウを近似
  */

  ctx.shadowColor=
  "rgba(0,0,0,.85)";

  ctx.shadowBlur=2;

  ctx.shadowOffsetX=1.5;

  ctx.shadowOffsetY=3;

  ctx.fillText(
    char,
    0,
    0
  );

  ctx.restore();
}


/* =====================================================
   KNOWN PATTERN SEARCH
===================================================== */

function findKnownPattern(
  text,
  index
){

  for(
    const pattern
    of knownPatterns
  ){

    if(
      text.startsWith(
        pattern.text,
        index
      )
    ){
      return pattern;
    }
  }

  return null;
}


/* =====================================================
   DRAW KNOWN PATTERN
===================================================== */

function drawKnownPattern(
  pattern,
  x,
  y,
  style,
  fontSize
){

  for(
    const part
    of pattern.chars
  ){

    drawGlyph(
      part.char,
      x + part.x*(fontSize/64),
      y + part.y*(fontSize/64),
      style,
      part.sx,
      part.sy
    );

  }

  return(
    fontSize*
    pattern.advance
  );
}


/* =====================================================
   DRAW TEXT TOKEN
===================================================== */

function drawTextToken(
  token,
  startX,
  baseline
){

  let x=startX;

  const style=
  token.style;

  const fontSize=
  setFont(style);

  const chars=
  Array.from(token.text);


  for(
    let i=0;
    i<chars.length;
    i++
  ){

    /*
      まず実機確認済みクラスタを探す
    */

    const remaining=
    chars.slice(i).join("");

    const pattern=
    findKnownPattern(
      remaining,
      0
    );


    if(pattern){

      x+=drawKnownPattern(
        pattern,
        x,
        baseline,
        style,
        fontSize
      );

      i+=
      Array.from(
        pattern.text
      ).length-1;

      continue;
    }


    const ch=
    chars[i];

    const rule=
    calibration[ch] ||
    calibration.normal;


    setFont(style);

    const measured=
    ctx.measureText(ch).width;


    /*
      combining mark は
      advanceを持たせない
    */

    const combining=
    /\p{M}/u.test(ch);


    drawGlyph(
      ch,

      x+
      rule.x*
      (fontSize/64),

      baseline+
      rule.y*
      (fontSize/64),

      style,

      rule.scaleX,

      rule.scaleY
    );


    if(combining){

      continue;
    }


    if(
      calibration[ch]
    ){

      x+=
      fontSize*
      rule.advance;

    }
    else{

      x+=
      measured*
      rule.advance;

    }

  }


  return x;
}


/* =====================================================
   DRAW TOKENS
===================================================== */

function drawTokens(tokens){

  /*
    TOPIAスクショを基準に
    左側から開始
  */

  const startX=48;

  let x=startX;

  let baseline=205;


  for(const token of tokens){

    if(token.type==="newline"){

      x=startX;

      baseline+=68;

      continue;
    }


    if(token.type==="text"){

      x=
      drawTextToken(
        token,
        x,
        baseline
      );

    }

  }

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const raw=
  input.value;

  const size=
  setupCanvas();

  ctx.clearRect(
    0,
    0,
    size.width,
    size.height
  );


  const count=
  estimateLength(raw);

  counter.textContent=
  "推定："+count+" / 50";


  if(count>50){

    warning.textContent=
    "⚠ 上限超過";

    warning.className=
    "warning";

  }

  else if(count>=45){

    warning.textContent=
    "⚠ 上限付近";

    warning.className=
    "warning";

  }

  else{

    warning.textContent="";

  }


  if(!raw){
    return;
  }


  const tokens=
  parseCode(raw);

  drawTokens(tokens);

}


/* =====================================================
   EVENTS
===================================================== */

input.addEventListener(
  "input",
  render
);

window.addEventListener(
  "resize",
  render
);


/* =====================================================
   COPY
===================================================== */

document
.getElementById("copy")
.addEventListener(
"click",
async function(){

  const button=this;

  try{

    await navigator
    .clipboard
    .writeText(
      input.value
    );

    button.textContent=
    "コピーしました ✓";

    setTimeout(
      function(){

        button.textContent=
        "コードをコピー";

      },
      1200
    );

  }

  catch(e){

    input.select();

    document.execCommand(
      "copy"
    );

  }

});


/* =====================================================
   CLEAR
===================================================== */

document
.getElementById("clear")
.addEventListener(
"click",
function(){

  input.value="";

  render();

  input.focus();

});


/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
