<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101116;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:5px 0;
  font-size:24px;
}

.sub{
  margin:5px 0 16px;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

textarea{
  width:100%;
  height:170px;
  padding:14px;

  background:#1b1d26;
  color:#fff;

  border:1px solid #484b57;
  border-radius:14px;

  font-size:16px;
  line-height:1.5;

  resize:vertical;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin:8px 2px 12px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.danger{
  color:#ff7373;
}


/* =========================
   スイッチ
========================= */

.controls{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:13px;

  color:#bbb;
  font-size:13px;
}

.switch{
  position:relative;
  display:inline-block;

  width:46px;
  height:26px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;

  background:#444;
  border-radius:30px;

  transition:.2s;
}

.slider:before{
  content:"";

  position:absolute;

  width:20px;
  height:20px;

  top:3px;
  left:3px;

  background:#fff;
  border-radius:50%;

  transition:.2s;
}

.switch input:checked + .slider{
  background:#ff86b4;
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}


/* =========================
   プレビュー
========================= */

.stage{
  position:relative;

  min-height:390px;

  overflow:hidden;

  border:1px solid #3b3d49;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 20% 20%,
      #3b4057 0,
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 80%,
      #392d4b 0,
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #242735,
      #111218
    );
}

.stageTitle{
  position:absolute;

  top:12px;
  left:14px;

  color:#999;
  font-size:12px;
}

#preview{
  position:absolute;

  top:65px;
  left:12px;
  right:12px;

  min-height:280px;

  white-space:pre;
  text-align:left;

  text-shadow:
    0 2px 3px #000,
    0 0 7px rgba(255,255,255,.15);
}

.topia-line{
  position:relative;
  display:block;

  min-height:100px;

  white-space:nowrap;
}


/* ==================================================
   ゆずき実機ユニット
================================================== */

.yuzuki-unit{
  position:relative;

  display:inline-block;

  width:330px;
  height:150px;

  vertical-align:top;

  transform-origin:left top;
}


/* ゆ */

.yu{
  position:absolute;

  left:0;
  top:27px;

  color:#fff;

  font-size:82px;
  line-height:1;

  font-style:italic;

  font-family:
    -apple-system,
    "Hiragino Sans",
    sans-serif;

  z-index:5;
}


/* ず */

.zu{
  position:absolute;

  left:105px;
  top:62px;

  color:#fff;

  font-size:40px;
  line-height:1;

  font-style:italic;

  z-index:6;
}


/* =========================
   特殊エフェクト全体
========================= */

.effect{
  position:absolute;

  left:140px;
  top:0;

  width:180px;
  height:150px;

  transform-origin:center center;
}


/* ᭄ */

.kudari{
  position:absolute;

  left:0;
  top:-7px;

  color:#00ffcc;

  font-size:112px;
  line-height:1;

  font-style:italic;

  transform:
    scaleX(.72)
    scaleY(.96);

  transform-origin:center;

  z-index:1;
}


/* ꦿૢ */

.heart{
  position:absolute;

  left:35px;
  top:70px;

  color:#99ffff;

  font-size:61px;
  line-height:1;

  font-style:italic;

  transform:
    scaleX(.82)
    scaleY(.76);

  transform-origin:center;

  z-index:4;
}


/* ₈ */

.eightLow{
  position:absolute;

  left:91px;
  top:40px;

  color:#99ffff;

  font-size:48px;
  line-height:1;

  font-weight:bold;

  z-index:5;
}


/* ⁸ */

.eightHigh{
  position:absolute;

  left:130px;
  top:3px;

  color:#99ffff;

  font-size:50px;
  line-height:1;

  font-weight:bold;

  z-index:5;
}


/* =========================
   キャリブレーション
========================= */

.calibration{
  margin-top:14px;
  padding:14px;

  background:#181a22;

  border:1px solid #30323c;
  border-radius:14px;
}

.calibrationTitle{
  margin-bottom:5px;

  font-size:15px;
  font-weight:bold;
}

.calibrationSub{
  margin-bottom:12px;

  color:#999;
  font-size:12px;
  line-height:1.5;
}

.values{
  padding:9px 10px;
  margin-bottom:10px;

  background:#111218;

  border-radius:9px;

  color:#aaa;
  font-size:12px;

  text-align:center;
}

.pad{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  max-width:330px;
  margin:auto;
}

.pad button{
  min-height:48px;

  background:#30333f;
  color:#fff;

  border:0;
  border-radius:10px;

  font-size:20px;
  font-weight:bold;
}

.pad .empty{
  visibility:hidden;
}

.zoom{
  display:flex;
  gap:7px;

  margin-top:10px;
}

.zoom button{
  flex:1;

  padding:11px;

  background:#30333f;
  color:#fff;

  border:0;
  border-radius:10px;

  font-size:15px;
  font-weight:bold;
}

.reset{
  margin-top:9px;

  width:100%;
  padding:11px;

  background:#402d36;
  color:#ffb5cf;

  border:0;
  border-radius:10px;

  font-size:14px;
}


/* =========================
   通常ボタン
========================= */

.buttons{
  display:flex;
  gap:8px;

  margin-top:14px;
}

.buttons button{
  flex:1;

  padding:12px;

  border:0;
  border-radius:12px;

  font-size:15px;
  font-weight:bold;
}

.copy{
  background:#ff8eb8;
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}


/* =========================
   サンプル
========================= */

.samples{
  margin-top:20px;
  padding:14px;

  background:#181a22;

  border:1px solid #30323c;
  border-radius:14px;
}

.samplesTitle{
  margin-bottom:10px;

  font-size:14px;
  font-weight:bold;
}

.sample{
  width:100%;

  margin-top:7px;
  padding:11px;

  background:#292c37;
  color:#fff;

  border:0;
  border-radius:10px;

  font-size:14px;
}

.note{
  margin-top:15px;

  color:#888;

  font-size:12px;
  line-height:1.6;
}

</style>
</head>


<body>

<main>

<h1>
✨ トピア弾幕プレビュー v4
</h1>

<div class="sub">
実機スクショを基準に特殊文字の位置を調整できるキャリブレーション版
</div>


<textarea
id="code"
spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>


<div class="info">

<span id="counter">
全角換算目安：0 / 50
</span>

<span id="warning"></span>

</div>


<div class="controls">

<label class="switch">

<input
type="checkbox"
id="topiaMode"
checked
>

<span class="slider"></span>

</label>

<span>
TOPIA実機補正
</span>

</div>


<div class="stage">

<div class="stageTitle">
TOPIA実機風プレビュー
</div>

<div id="preview"></div>

</div>


<!-- キャリブレーション -->

<div
class="calibration"
id="calibration"
>

<div class="calibrationTitle">
🎯 特殊エフェクト位置調整
</div>

<div class="calibrationSub">
実機画像を見ながら「᭄ꦿૢ₈⁸」の位置と大きさを調整できます。
</div>


<div
class="values"
id="values"
>
X: 0　Y: 0　倍率: 1.00
</div>


<div class="pad">

<div class="empty"></div>

<button data-move="up">
↑
</button>

<div class="empty"></div>


<button data-move="left">
←
</button>

<button data-move="down">
↓
</button>

<button data-move="right">
→
</button>

</div>


<div class="zoom">

<button id="smaller">
− 小さく
</button>

<button id="larger">
＋ 大きく
</button>

</div>


<button
class="reset"
id="reset"
>
初期位置に戻す
</button>

</div>


<div class="buttons">

<button
class="copy"
id="copy"
>
コードをコピー
</button>

<button
class="clear"
id="clear"
>
クリア
</button>

</div>


<div class="samples">

<div class="samplesTitle">
実機比較サンプル
</div>

<button
class="sample"
id="sampleYuzuki"
>
🩵 ゆずき実機テスト
</button>

<button
class="sample"
id="sampleThree"
>
🩵 ゆずき3段弾幕
</button>

</div>


<div class="note">
調整値はこの端末のブラウザに保存されます。
TOPIA側とSafariではフォント描画方式が異なるため、実機確認済みパターンを優先して補正します。
</div>

</main>


<script>

const input =
document.getElementById("code");

const preview =
document.getElementById("preview");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");

const topiaMode =
document.getElementById("topiaMode");

const calibration =
document.getElementById("calibration");

const values =
document.getElementById("values");


/* ==================================================
   保存値
================================================== */

let adjust = {

  x:
  Number(
    localStorage.getItem(
      "topiaEffectX"
    )
  ) || 0,

  y:
  Number(
    localStorage.getItem(
      "topiaEffectY"
    )
  ) || 0,

  scale:
  Number(
    localStorage.getItem(
      "topiaEffectScale"
    )
  ) || 1

};


/* ==================================================
   ESCAPE
================================================== */

function escapeHTML(text){

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


/* ==================================================
   LENGTH
================================================== */

function topiaLength(text){

  let total=0;

  for(
    const char
    of Array.from(text)
  ){

    if(
      char.codePointAt(0)<=0x7f
    ){

      total+=0.5;

    }else{

      total+=1;

    }

  }

  return total;

}


/* ==================================================
   SIZE
================================================== */

function sizePx(size){

  let px =
  Number(size)*0.82;

  if(px<10){
    px=10;
  }

  if(px>130){
    px=130;
  }

  return px;

}


/* ==================================================
   通常パーサー
================================================== */

function parseNormal(raw){

  let output="";
  let last=0;

  const regex =
  /(<\/?b>|<\/?i>|<size=([^>]+)>|<\/size>|<color=([^>]+)>|<\/color>)/gi;

  let match;


  while(
    (match=regex.exec(raw))!==null
  ){

    output+=
    escapeHTML(
      raw.substring(
        last,
        match.index
      )
    );


    const lower =
    match[0].toLowerCase();


    if(lower==="<b>"){

      output+="<b>";

    }

    else if(lower==="</b>"){

      output+="</b>";

    }

    else if(lower==="<i>"){

      output+="<i>";

    }

    else if(lower==="</i>"){

      output+="</i>";

    }

    else if(
      lower.startsWith(
        "<size="
      )
    ){

      let size =
      parseFloat(
        match[2]
      );

      if(isNaN(size)){
        size=40;
      }

      output+=
      '<span style="font-size:'+
      sizePx(size)+
      'px;line-height:1;">';

    }

    else if(
      lower==="</size>"
    ){

      output+="</span>";

    }

    else if(
      lower.startsWith(
        "<color="
      )
    ){

      let color =
      match[3].trim();

      if(
        !/^#[0-9a-f]{3}([0-9a-f]{3})?$/i
        .test(color)
      ){

        color="#fff";

      }

      output+=
      '<span style="color:'+
      color+
      '">';

    }

    else if(
      lower==="</color>"
    ){

      output+="</span>";

    }


    last =
    regex.lastIndex;

  }


  output+=
  escapeHTML(
    raw.substring(last)
  );


  return output;

}


/* ==================================================
   ゆずきユニット
================================================== */

function yuzukiUnit(){

  return `

  <span class="yuzuki-unit">

    <span class="yu">
      ゆ
    </span>

    <span class="zu">
      ず
    </span>

    <span
      class="effect"
      style="
      transform:
      translate(
        ${adjust.x}px,
        ${adjust.y}px
      )
      scale(
        ${adjust.scale}
      );
      "
    >

      <span class="kudari">
        ᭄
      </span>

      <span class="heart">
        ꦿૢ
      </span>

      <span class="eightLow">
        ₈
      </span>

      <span class="eightHigh">
        ⁸
      </span>

    </span>

  </span>

  `;

}


/* ==================================================
   TOPIA実機モード
================================================== */

function parseTopia(raw){

  /*
    今回実機確認済みの
    ゆずきコード全体を検出
  */

  const pattern =
  /<i><size=80>ゆ<size=40>ず<\/size><color=#0fc>᭄<\/color><color=#9ff>ꦿૢ₈⁸<\/color><\/size><\/i>/gi;


  const token =
  "___YUZUKI_TOPIA_UNIT___";


  let work =
  raw.replace(
    pattern,
    token
  );


  let html =
  parseNormal(work);


  html =
  html.replaceAll(
    token,
    yuzukiUnit()
  );


  return html;

}


/* ==================================================
   RENDER
================================================== */

function render(){

  const raw =
  input.value;


  const lines =
  raw.split(/\\ua/gi);


  let output="";


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      i===0 &&
      lines[i]===""
    ){
      continue;
    }


    let html;


    if(topiaMode.checked){

      html =
      parseTopia(
        lines[i]
      );

    }else{

      html =
      parseNormal(
        lines[i]
      );

    }


    output+=
    '<div class="topia-line">'+
    html+
    '</div>';

  }


  preview.innerHTML =
  output;


  updateInfo();

  updateValues();

}


/* ==================================================
   INFO
================================================== */

function updateInfo(){

  const length =
  topiaLength(
    input.value
  );


  const display =
  Number.isInteger(length)
  ?
  length
  :
  length.toFixed(1);


  counter.textContent =
  "全角換算目安："+
  display+
  " / 50";


  if(length>50){

    warning.textContent =
    "⚠ 長すぎる可能性";

    warning.className =
    "danger";

  }else{

    warning.textContent="";

  }

}


/* ==================================================
   VALUES
================================================== */

function updateValues(){

  values.textContent =
  "X: "+
  adjust.x+
  "　Y: "+
  adjust.y+
  "　倍率: "+
  adjust.scale.toFixed(2);

}


/* ==================================================
   SAVE
================================================== */

function saveAdjust(){

  localStorage.setItem(
    "topiaEffectX",
    adjust.x
  );

  localStorage.setItem(
    "topiaEffectY",
    adjust.y
  );

  localStorage.setItem(
    "topiaEffectScale",
    adjust.scale
  );

}


/* ==================================================
   MOVE
================================================== */

document
.querySelectorAll(
  "[data-move]"
)
.forEach(
  button=>{

    button.addEventListener(
      "click",
      function(){

        const move =
        this.dataset.move;


        /*
          1回 3px
        */

        if(move==="up"){

          adjust.y-=3;

        }

        if(move==="down"){

          adjust.y+=3;

        }

        if(move==="left"){

          adjust.x-=3;

        }

        if(move==="right"){

          adjust.x+=3;

        }


        saveAdjust();

        render();

      }
    );

  }
);


/* ==================================================
   SCALE
================================================== */

document
.getElementById(
  "larger"
)
.addEventListener(
  "click",
  function(){

    adjust.scale+=0.03;

    if(adjust.scale>2){
      adjust.scale=2;
    }

    saveAdjust();

    render();

  }
);


document
.getElementById(
  "smaller"
)
.addEventListener(
  "click",
  function(){

    adjust.scale-=0.03;

    if(adjust.scale<0.4){
      adjust.scale=0.4;
    }

    saveAdjust();

    render();

  }
);


/* ==================================================
   RESET
================================================== */

document
.getElementById(
  "reset"
)
.addEventListener(
  "click",
  function(){

    adjust={
      x:0,
      y:0,
      scale:1
    };

    saveAdjust();

    render();

  }
);


/* ==================================================
   INPUT
================================================== */

input.addEventListener(
  "input",
  render
);


topiaMode.addEventListener(
  "change",
  function(){

    calibration.style.display =
    this.checked
    ?
    "block"
    :
    "none";

    render();

  }
);


/* ==================================================
   COPY
================================================== */

document
.getElementById(
  "copy"
)
.addEventListener(
  "click",
  async function(){

    try{

      await navigator.clipboard
      .writeText(
        input.value
      );


      this.textContent =
      "コピーしました ✓";


      const button =
      this;


      setTimeout(
        function(){

          button.textContent =
          "コードをコピー";

        },
        1200
      );

    }

    catch(e){

      input.select();

      document.execCommand(
        "copy"
      );

    }

  }
);


/* ==================================================
   CLEAR
================================================== */

document
.getElementById(
  "clear"
)
.addEventListener(
  "click",
  function(){

    input.value="";

    render();

    input.focus();

  }
);


/* ==================================================
   SAMPLE
================================================== */

document
.getElementById(
  "sampleYuzuki"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '<i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleThree"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '\\ua<i><size=60><color=#9ff>　꙰♡✺꙰\\ua👏ゆ⃟ず⃟き⃟👏\\ua　꙰♡✺꙰</color></size></i>';

    render();

  }
);


/* ==================================================
   START
================================================== */

render();

</script>

</body>
</html>
