<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>トピア弾幕プレビュー v5</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#101116;
  --panel:#1b1d26;
  --panel2:#171920;
  --border:#414451;
  --text:#fff;
  --sub:#999;
  --pink:#ff86b4;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:5px 0;
  font-size:24px;
}

.sub{
  margin:5px 0 16px;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

/* =========================
   入力
========================= */

textarea{
  width:100%;
  height:170px;
  padding:14px;

  background:var(--panel);
  color:#fff;

  border:1px solid #484b57;
  border-radius:14px;

  font-size:16px;
  line-height:1.5;

  resize:vertical;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin:8px 2px 12px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.danger{
  color:#ff7373;
}

/* =========================
   スイッチ
========================= */

.modeRow{
  display:flex;
  align-items:center;
  gap:10px;

  margin:12px 0;
}

.switch{
  position:relative;
  display:inline-block;

  width:48px;
  height:27px;

  flex:none;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;

  background:#444;
  border-radius:30px;

  transition:.2s;
}

.slider:before{
  content:"";

  position:absolute;

  width:21px;
  height:21px;

  left:3px;
  top:3px;

  background:#fff;
  border-radius:50%;

  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--pink);
}

.switch input:checked + .slider:before{
  transform:translateX(21px);
}

.modeText{
  color:#bbb;
  font-size:14px;
}

/* =========================
   TOPIA表示エリア
========================= */

.stage{
  position:relative;

  width:100%;
  height:230px;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:18px;

  background:
    linear-gradient(
      rgba(10,11,15,.48),
      rgba(10,11,15,.48)
    ),
    radial-gradient(
      circle at 25% 30%,
      #45495d,
      transparent 40%
    ),
    radial-gradient(
      circle at 80% 75%,
      #493450,
      transparent 42%
    ),
    #20222c;
}

.stageTitle{
  position:absolute;

  top:10px;
  left:13px;

  color:#aaa;
  font-size:12px;

  z-index:20;
}

/*
  TOPIAではコメントが
  左側を基準に表示されるため
  centerにはしない
*/

#preview{
  position:absolute;

  left:20px;
  top:50%;

  transform:translateY(-50%);

  width:calc(100% - 40px);

  white-space:nowrap;

  text-align:left;

  text-shadow:
    0 2px 3px rgba(0,0,0,.85),
    0 0 5px rgba(255,255,255,.08);
}

.topiaLine{
  display:block;

  position:relative;

  min-height:58px;

  white-space:nowrap;
}

/* =========================
   TOPIA文字
========================= */

.topiaText{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    sans-serif;

  transform-origin:left center;
}

/* =========================
   特殊Unicode
========================= */

/*
  基本方針：

  Unicodeを分解しない。
  Safariにそのまま描画させる。

  ここがv4との大きな違い。
*/

.rawUnicode{
  display:inline;
}

/* ꙰♡✺꙰ */

.scatter{
  display:inline;

  font-family:
    -apple-system,
    "Hiragino Sans",
    sans-serif;
}

/* ⃟ */

.diamondText{
  display:inline;
}

/* =========================
   実機補正
========================= */

/*
  TOPIA実機補正ONの場合だけ
  特殊パターンに軽い補正を掛ける。

  字形そのものを作り直さない。
*/

.topiaCorrection .effectYuzuki{
  display:inline-block;

  transform:
    translateX(-4px)
    translateY(3px)
    scaleX(.92);

  transform-origin:left center;
}

.topiaCorrection .scatter{
  display:inline-block;

  transform:scale(1.06);

  transform-origin:center;
}

/* =========================
   表示倍率
========================= */

.scalePanel{
  margin-top:12px;
  padding:12px;

  background:var(--panel2);

  border:1px solid #30333d;
  border-radius:13px;
}

.scaleTitle{
  margin-bottom:9px;

  color:#bbb;
  font-size:13px;
}

.scaleControls{
  display:flex;
  align-items:center;
  gap:8px;
}

.scaleControls button{
  width:48px;
  height:42px;

  border:0;
  border-radius:10px;

  background:#30333f;
  color:#fff;

  font-size:20px;
  font-weight:bold;
}

#scaleValue{
  flex:1;

  text-align:center;

  color:#aaa;
  font-size:13px;
}

/* =========================
   ボタン
========================= */

.buttons{
  display:flex;
  gap:8px;

  margin-top:14px;
}

.buttons button{
  flex:1;

  padding:13px;

  border:0;
  border-radius:12px;

  font-size:15px;
  font-weight:bold;
}

.copy{
  background:#ff8eb8;
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}

/* =========================
   サンプル
========================= */

.samples{
  margin-top:18px;
  padding:14px;

  background:#181a22;

  border:1px solid #30323c;
  border-radius:14px;
}

.samplesTitle{
  margin-bottom:10px;

  font-size:14px;
  font-weight:bold;
}

.sample{
  width:100%;

  margin-top:7px;
  padding:11px;

  background:#292c37;
  color:#fff;

  border:0;
  border-radius:10px;

  font-size:14px;
}

.note{
  margin-top:15px;

  color:#888;

  font-size:12px;
  line-height:1.7;
}

/* =========================
   スマホ
========================= */

@media(max-width:500px){

  main{
    padding:16px;
  }

  h1{
    font-size:23px;
  }

  .stage{
    height:220px;
  }

  #preview{
    left:14px;
    width:calc(100% - 28px);
  }

}

</style>
</head>

<body>

<main>

<h1>
✨ トピア弾幕プレビュー v5
</h1>

<div class="sub">
\ua・size・color・b・i・特殊Unicode対応
</div>


<textarea
id="code"
spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>


<div class="info">

<span id="counter">
全角換算目安：0 / 50
</span>

<span id="warning"></span>

</div>


<div class="modeRow">

<label class="switch">

<input
type="checkbox"
id="correction"
checked
>

<span class="slider"></span>

</label>

<span class="modeText">
TOPIA実機補正
</span>

</div>


<div class="stage">

<div class="stageTitle">
TOPIA実機風プレビュー
</div>

<div
id="preview"
class="topiaCorrection"
></div>

</div>


<div class="scalePanel">

<div class="scaleTitle">
プレビュー全体の大きさ
</div>

<div class="scaleControls">

<button id="scaleDown">
−
</button>

<div id="scaleValue">
100%
</div>

<button id="scaleUp">
＋
</button>

</div>

</div>


<div class="buttons">

<button
class="copy"
id="copy"
>
コードをコピー
</button>

<button
class="clear"
id="clear"
>
クリア
</button>

</div>


<div class="samples">

<div class="samplesTitle">
実機テスト
</div>

<button
class="sample"
id="sampleYuzuki"
>
🩵 ゆずき特殊文字
</button>

<button
class="sample"
id="sampleThree"
>
🩵 ゆずき3段
</button>

<button
class="sample"
id="sampleScatter"
>
✨ ꙰♡✺꙰ テスト
</button>

<button
class="sample"
id="sampleDiamond"
>
💎 ⃟ 結合文字テスト
</button>

</div>


<div class="note">
v5では特殊Unicodeを原則として分解せず、そのままブラウザへ渡します。
TOPIAとSafariではフォント・Unicode結合処理が異なるため完全一致ではありませんが、
実機確認できたパターンから補正値を追加できます。
</div>

</main>


<script>

/* ==================================================
   DOM
================================================== */

const input =
document.getElementById("code");

const preview =
document.getElementById("preview");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");

const correction =
document.getElementById("correction");

const scaleValue =
document.getElementById("scaleValue");


/* ==================================================
   STATE
================================================== */

let previewScale =
Number(
  localStorage.getItem(
    "topiaPreviewScale"
  )
) || 1;


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(text){

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


/* ==================================================
   COLOR
================================================== */

function safeColor(color){

  color =
  color.trim();


  if(
    /^#[0-9a-f]{3}$/i.test(color)
    ||
    /^#[0-9a-f]{6}$/i.test(color)
  ){

    return color;

  }


  return "#fff";

}


/* ==================================================
   SIZE
================================================== */

/*
  TOPIA size値 → Safari px

  実機比較をしながら
  後からこの係数だけ変更可能。
*/

function sizeToPx(size){

  size =
  Number(size);


  if(
    !Number.isFinite(size)
  ){

    size=40;

  }


  let px =
  size * 0.82;


  if(px<8){
    px=8;
  }


  if(px>140){
    px=140;
  }


  return px;

}


/* ==================================================
   TOKENIZER
================================================== */

/*
  v5ではタグを順番に読み取る。

  sizeの入れ子
  colorの入れ子

  を壊しにくくする。
*/

function tokenize(text){

  const regex =
  /(\\ua|<\/?b>|<\/?i>|<size=[^>]+>|<\/size>|<color=[^>]+>|<\/color>)/gi;


  const tokens=[];

  let last=0;

  let match;


  while(
    (match=regex.exec(text))!==null
  ){

    if(
      match.index>last
    ){

      tokens.push({
        type:"text",
        value:
        text.slice(
          last,
          match.index
        )
      });

    }


    tokens.push({
      type:"tag",
      value:match[0]
    });


    last =
    regex.lastIndex;

  }


  if(
    last<text.length
  ){

    tokens.push({
      type:"text",
      value:
      text.slice(last)
    });

  }


  return tokens;

}


/* ==================================================
   特殊文字マーク
================================================== */

function markSpecial(text){

  let safe =
  escapeHTML(text);


  /*
    ゆずき特殊文字

    Unicode列そのものは
    分解しない。
  */

  safe =
  safe.replace(
    /᭄ꦿૢ₈⁸/g,
    '<span class="effectYuzuki">᭄ꦿૢ₈⁸</span>'
  );


  safe =
  safe.replace(
    /꙰♡✺꙰/g,
    '<span class="scatter">꙰♡✺꙰</span>'
  );


  /*
    ⃟ を含む文字列は
    Unicodeのまま表示。
  */

  return safe;

}


/* ==================================================
   PARSER
================================================== */

function parse(text){

  const tokens =
  tokenize(text);


  let html="";


  /*
    閉じタグを安全に扱うための
    スタック
  */

  const stack=[];


  for(
    const token
    of tokens
  ){

    if(
      token.type==="text"
    ){

      html+=
      markSpecial(
        token.value
      );

      continue;

    }


    const tag =
    token.value;


    const lower =
    tag.toLowerCase();


    /* \ua */

    if(
      lower==="\\ua"
    ){

      /*
        開いているspanを壊さず
        見た目だけ改行
      */

      html+=
      '<br class="uaBreak">';

      continue;

    }


    /* bold */

    if(
      lower==="<b>"
    ){

      html+="<b>";

      stack.push("b");

      continue;

    }


    if(
      lower==="</b>"
    ){

      html+="</b>";

      removeLast(
        stack,
        "b"
      );

      continue;

    }


    /* italic */

    if(
      lower==="<i>"
    ){

      html+="<i>";

      stack.push("i");

      continue;

    }


    if(
      lower==="</i>"
    ){

      html+="</i>";

      removeLast(
        stack,
        "i"
      );

      continue;

    }


    /* size */

    if(
      lower.startsWith(
        "<size="
      )
    ){

      const value =
      tag.match(
        /<size=([^>]+)>/i
      );


      const size =
      value
      ?
      value[1]
      :
      40;


      html+=
      '<span class="topiaText" style="font-size:'+
      sizeToPx(size)+
      'px;line-height:1;">';


      stack.push(
        "size"
      );


      continue;

    }


    if(
      lower==="</size>"
    ){

      html+="</span>";

      removeLast(
        stack,
        "size"
      );

      continue;

    }


    /* color */

    if(
      lower.startsWith(
        "<color="
      )
    ){

      const value =
      tag.match(
        /<color=([^>]+)>/i
      );


      const color =
      value
      ?
      safeColor(
        value[1]
      )
      :
      "#fff";


      html+=
      '<span style="color:'+
      color+
      ';">';


      stack.push(
        "color"
      );


      continue;

    }


    if(
      lower==="</color>"
    ){

      html+="</span>";

      removeLast(
        stack,
        "color"
      );

      continue;

    }

  }


  return html;

}


/* ==================================================
   STACK
================================================== */

function removeLast(
  stack,
  type
){

  for(
    let i=stack.length-1;
    i>=0;
    i--
  ){

    if(
      stack[i]===type
    ){

      stack.splice(
        i,
        1
      );

      return;

    }

  }

}


/* ==================================================
   TOPIA LENGTH
================================================== */

/*
  現時点では実機で

  「全角50文字以内」

  という表示を確認済み。

  半角の正確な換算ルールは
  未確認なので目安として表示。
*/

function topiaLength(text){

  let total=0;


  for(
    const char
    of Array.from(text)
  ){

    const cp =
    char.codePointAt(0);


    if(
      cp<=0x7f
    ){

      total+=0.5;

    }else{

      total+=1;

    }

  }


  return total;

}


/* ==================================================
   RENDER
================================================== */

function render(){

  const raw =
  input.value;


  let html =
  parse(raw);


  preview.innerHTML =
  html;


  if(
    correction.checked
  ){

    preview.classList.add(
      "topiaCorrection"
    );

  }else{

    preview.classList.remove(
      "topiaCorrection"
    );

  }


  preview.style.fontSize =
  (40*previewScale)+
  "px";


  updateCounter();

  updateScale();

}


/* ==================================================
   COUNTER
================================================== */

function updateCounter(){

  const length =
  topiaLength(
    input.value
  );


  const shown =
  Number.isInteger(length)
  ?
  length
  :
  length.toFixed(1);


  counter.textContent =
  "全角換算目安："+
  shown+
  " / 50";


  if(
    length>50
  ){

    warning.textContent =
    "⚠ 50文字超過の可能性";

    warning.className =
    "danger";

  }else if(
    length>=45
  ){

    warning.textContent =
    "⚠ 上限付近";

    warning.className =
    "warning";

  }else{

    warning.textContent="";

  }

}


/* ==================================================
   SCALE
================================================== */

function updateScale(){

  scaleValue.textContent =
  Math.round(
    previewScale*100
  )+
  "%";

}


document
.getElementById(
  "scaleUp"
)
.addEventListener(
  "click",
  function(){

    previewScale+=0.05;


    if(
      previewScale>1.5
    ){

      previewScale=1.5;

    }


    saveScale();

    render();

  }
);


document
.getElementById(
  "scaleDown"
)
.addEventListener(
  "click",
  function(){

    previewScale-=0.05;


    if(
      previewScale<0.5
    ){

      previewScale=0.5;

    }


    saveScale();

    render();

  }
);


function saveScale(){

  localStorage.setItem(
    "topiaPreviewScale",
    previewScale
  );

}


/* ==================================================
   INPUT
================================================== */

input.addEventListener(
  "input",
  render
);


correction.addEventListener(
  "change",
  render
);


/* ==================================================
   COPY
================================================== */

document
.getElementById(
  "copy"
)
.addEventListener(
  "click",
  async function(){

    try{

      await navigator.clipboard
      .writeText(
        input.value
      );


      this.textContent =
      "コピーしました ✓";


      const button=this;


      setTimeout(
        function(){

          button.textContent =
          "コードをコピー";

        },
        1200
      );

    }

    catch(e){

      input.select();

      document.execCommand(
        "copy"
      );

    }

  }
);


/* ==================================================
   CLEAR
================================================== */

document
.getElementById(
  "clear"
)
.addEventListener(
  "click",
  function(){

    input.value="";

    render();

    input.focus();

  }
);


/* ==================================================
   SAMPLES
================================================== */

document
.getElementById(
  "sampleYuzuki"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '<i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleThree"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '\\ua<i><size=60><color=#9ff>　꙰♡✺꙰\\ua👏ゆ⃟ず⃟き⃟👏\\ua　꙰♡✺꙰</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleScatter"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '\\ua<i><size=60><color=#9ff>꙰♡✺꙰</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleDiamond"
)
.addEventListener(
  "click",
  function(){

    input.value =
    '\\ua<size=60><color=#9ff>👏ゆ⃟ず⃟き⃟👏</color></size>';

    render();

  }
);


/* ==================================================
   START
================================================== */

render();

</script>

</body>
</html>
