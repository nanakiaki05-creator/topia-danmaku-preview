<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101116;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:5px 0;
  font-size:24px;
}

.sub{
  margin:5px 0 16px;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

textarea{
  width:100%;
  height:175px;
  padding:14px;

  background:#1b1d26;
  color:#fff;

  border:1px solid #484b57;
  border-radius:14px;

  font-size:16px;
  line-height:1.5;

  resize:vertical;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin:8px 2px 12px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.danger{
  color:#ff7373;
}

/* ===== 補正スイッチ ===== */

.controls{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:13px;

  color:#bbb;
  font-size:13px;
}

.switch{
  position:relative;
  display:inline-block;

  width:46px;
  height:26px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;

  background:#444;
  border-radius:30px;

  transition:.2s;
}

.slider:before{
  content:"";

  position:absolute;

  width:20px;
  height:20px;

  top:3px;
  left:3px;

  background:#fff;
  border-radius:50%;

  transition:.2s;
}

.switch input:checked + .slider{
  background:#ff86b4;
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}


/* ===== プレビュー ===== */

.stage{
  position:relative;

  min-height:390px;

  overflow:hidden;

  border:1px solid #3b3d49;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 20% 20%,
      #3b4057 0,
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 80%,
      #392d4b 0,
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #242735,
      #111218
    );
}

.stageTitle{
  position:absolute;

  top:12px;
  left:14px;

  color:#999;
  font-size:12px;
}

#preview{
  position:absolute;

  top:65px;
  left:12px;
  right:12px;

  min-height:270px;

  white-space:pre;
  text-align:left;

  text-shadow:
    0 2px 3px #000,
    0 0 7px rgba(255,255,255,.15);
}

.topia-line{
  position:relative;
  display:block;

  min-height:95px;

  white-space:nowrap;
}


/* ==================================================
   通常文字
   ================================================== */

.text-run{
  position:relative;
  display:inline;
}


/* ==================================================
   TOPIA実機補正
   ================================================== */

/*
  重要:
  Unicodeを1文字ずつspanに分解しない。
*/


/* ===== ゆずき特殊エフェクト ===== */

.yuzuki-effect{
  position:relative;

  display:inline-block;

  width:128px;
  height:100px;

  margin-left:-6px;

  vertical-align:middle;
}


/*
  シアンの ᭄
*/

.yuzuki-kudari{
  position:absolute;

  left:-8px;
  top:-31px;

  font-size:100px;
  line-height:1;

  color:#00ffcc;

  font-family:
    -apple-system,
    "Hiragino Sans",
    sans-serif;

  font-style:italic;

  transform:
    scaleX(.78)
    scaleY(1.12);

  transform-origin:center;

  z-index:1;
}


/*
  水色の ꦿૢ

  2文字を分解しない
*/

.yuzuki-heart{
  position:absolute;

  left:32px;
  top:35px;

  font-size:67px;
  line-height:1;

  color:#99ffff;

  font-family:
    -apple-system,
    "Hiragino Sans",
    sans-serif;

  font-style:italic;

  transform:
    scaleX(.82)
    scaleY(.88);

  transform-origin:center;

  z-index:3;
}


/*
  下側の ₈
*/

.yuzuki-eight-low{
  position:absolute;

  left:75px;
  top:3px;

  color:#99ffff;

  font-size:48px;
  font-weight:bold;

  line-height:1;

  z-index:4;
}


/*
  右上の ⁸
*/

.yuzuki-eight-high{
  position:absolute;

  left:103px;
  top:-30px;

  color:#99ffff;

  font-size:50px;
  font-weight:bold;

  line-height:1;

  z-index:4;
}


/* ==================================================
   ⃟
   ================================================== */

/*
  ⃟ は元文字との結合を維持する。

  個別span化しない。
*/

.combine-diamond{
  display:inline;
}


/* ==================================================
   ꙰♡✺꙰
   ================================================== */

.scatter-effect{
  position:relative;

  display:inline-block;

  font-size:inherit;

  transform:scale(1.08);

  transform-origin:center;
}


/* ===== ボタン ===== */

.buttons{
  display:flex;
  gap:8px;

  margin-top:14px;
}

button{
  flex:1;

  padding:12px;

  border:0;
  border-radius:12px;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;
}

.copy{
  background:#ff8eb8;
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}


/* ===== サンプル ===== */

.samples{
  margin-top:20px;
  padding:14px;

  background:#181a22;

  border:1px solid #30323c;
  border-radius:14px;
}

.samples-title{
  margin-bottom:10px;

  font-size:14px;
  font-weight:bold;
}

.sample{
  width:100%;
  margin-top:7px;

  background:#292c37;
  color:#fff;

  font-weight:normal;
}

.note{
  margin-top:15px;

  color:#888;

  font-size:12px;
  line-height:1.6;
}

</style>
</head>


<body>

<main>

<h1>
✨ トピア弾幕プレビュー v3
</h1>

<div class="sub">
\ua・color・size・b・i・特殊Unicodeをトピア実機風にプレビュー
</div>


<textarea
id="code"
spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>


<div class="info">

<span id="counter">
全角換算目安：0 / 50
</span>

<span id="warning"></span>

</div>


<div class="controls">

<label class="switch">

<input
type="checkbox"
id="topiaMode"
checked
>

<span class="slider"></span>

</label>

<span>
TOPIA実機補正
</span>

</div>


<div class="stage">

<div class="stageTitle">
TOPIA実機風プレビュー
</div>

<div id="preview"></div>

</div>


<div class="buttons">

<button
class="copy"
id="copy"
>
コードをコピー
</button>

<button
class="clear"
id="clear"
>
クリア
</button>

</div>


<div class="samples">

<div class="samples-title">
実機比較サンプル
</div>

<button
class="sample"
id="sampleYuzuki"
>
🩵 ゆずき実機テスト
</button>

<button
class="sample"
id="sampleYuzuki3"
>
🩵 ゆずき3段弾幕
</button>

</div>


<div class="note">
TOPIA実機補正では、実機スクリーンショットで確認できた特殊Unicodeの組み合わせを専用パターンとして補正します。
</div>

</main>


<script>

const input =
document.getElementById("code");

const preview =
document.getElementById("preview");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");

const topiaMode =
document.getElementById("topiaMode");


/* ==================================================
   HTMLエスケープ
   ================================================== */

function escapeHTML(text){

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


/* ==================================================
   全角換算目安
   ================================================== */

function topiaLength(text){

  let total=0;

  for(const char of Array.from(text)){

    const cp =
    char.codePointAt(0);

    if(cp<=0x7f){

      total+=0.5;

    }else{

      total+=1;

    }

  }

  return total;

}


/* ==================================================
   SIZE
   ================================================== */

function sizeToPx(size){

  let px =
  size * 0.82;

  if(px<10){
    px=10;
  }

  if(px>130){
    px=130;
  }

  return px;

}


/* ==================================================
   通常タグ解析
   ================================================== */

function parseNormal(raw){

  let output="";
  let last=0;

  const regex =
  /(<\/?b>|<\/?i>|<size=([^>]+)>|<\/size>|<color=([^>]+)>|<\/color>)/gi;

  let match;

  while(
    (match=regex.exec(raw))!==null
  ){

    output+=
    escapeHTML(
      raw.substring(
        last,
        match.index
      )
    );


    const lower =
    match[0].toLowerCase();


    if(lower==="<b>"){

      output+="<b>";

    }

    else if(lower==="</b>"){

      output+="</b>";

    }

    else if(lower==="<i>"){

      output+="<i>";

    }

    else if(lower==="</i>"){

      output+="</i>";

    }

    else if(
      lower.startsWith("<size=")
    ){

      let size =
      parseFloat(match[2]);

      if(isNaN(size)){
        size=40;
      }

      const px =
      sizeToPx(size);

      output+=
      '<span style="font-size:'+
      px+
      'px;line-height:1;">';

    }

    else if(
      lower==="</size>"
    ){

      output+="</span>";

    }

    else if(
      lower.startsWith("<color=")
    ){

      let color =
      match[3].trim();

      if(
        !/^#[0-9a-f]{3}([0-9a-f]{3})?$/i
        .test(color)
      ){

        color="#fff";

      }

      output+=
      '<span style="color:'+
      color+
      '">';

    }

    else if(
      lower==="</color>"
    ){

      output+="</span>";

    }


    last =
    regex.lastIndex;

  }


  output+=
  escapeHTML(
    raw.substring(last)
  );


  return output;

}


/* ==================================================
   ゆずき特殊パターン
   ==================================================

   実機確認コード:

   <color=#0FC>᭄</color>
   <color=#9ff>ꦿૢ₈⁸</color>

   この組み合わせだけを
   一体型エフェクトとして描画。
   ================================================== */

function yuzukiEffect(){

  return `
  <span class="yuzuki-effect">

    <span class="yuzuki-kudari">
      ᭄
    </span>

    <span class="yuzuki-heart">
      ꦿૢ
    </span>

    <span class="yuzuki-eight-low">
      ₈
    </span>

    <span class="yuzuki-eight-high">
      ⁸
    </span>

  </span>
  `;

}


/* ==================================================
   TOPIA実機補正
   ================================================== */

function parseTopia(raw){

  /*
    まず、ゆずき実機パターンを
    一時トークンへ置換
  */

  const yuzukiRegex =
  /<color=#0fc>᭄<\/color>\s*<color=#9ff>ꦿૢ₈⁸<\/color>/gi;


  const token =
  "___TOPIA_YUZUKI_EFFECT___";


  let work =
  raw.replace(
    yuzukiRegex,
    token
  );


  /*
    通常タグを解析
  */

  let html =
  parseNormal(work);


  /*
    エスケープ後のトークンを
    実機エフェクトへ戻す
  */

  html =
  html.replaceAll(
    token,
    yuzukiEffect()
  );


  /*
    ꙰♡✺꙰
  */

  html =
  html.replace(
    /꙰♡✺꙰/g,
    '<span class="scatter-effect">꙰♡✺꙰</span>'
  );


  return html;

}


/* ==================================================
   全体描画
   ================================================== */

function render(){

  const raw =
  input.value;


  /*
    \ua で行分割
  */

  const lines =
  raw.split(/\\ua/gi);


  let output="";


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      i===0 &&
      lines[i]===""
    ){
      continue;
    }


    let lineHTML;


    if(topiaMode.checked){

      lineHTML =
      parseTopia(
        lines[i]
      );

    }else{

      lineHTML =
      parseNormal(
        lines[i]
      );

    }


    output+=
    '<div class="topia-line">'+
    lineHTML+
    '</div>';

  }


  preview.innerHTML =
  output;


  updateCounter(raw);

}


/* ==================================================
   カウンター
   ================================================== */

function updateCounter(raw){

  const length =
  topiaLength(raw);


  const display =
  Number.isInteger(length)
  ? length
  : length.toFixed(1);


  counter.textContent =
  "全角換算目安："+
  display+
  " / 50";


  if(length>50){

    warning.textContent =
    "⚠ 長すぎる可能性";

    warning.className =
    "danger";

  }else{

    warning.textContent="";

  }

}


/* ==================================================
   入力
   ================================================== */

input.addEventListener(
  "input",
  render
);


topiaMode.addEventListener(
  "change",
  render
);


/* ==================================================
   COPY
   ================================================== */

document
.getElementById("copy")
.addEventListener(
  "click",
  async function(){

    try{

      await navigator.clipboard
      .writeText(
        input.value
      );


      this.textContent =
      "コピーしました ✓";


      const button=this;


      setTimeout(
        function(){

          button.textContent =
          "コードをコピー";

        },
        1200
      );

    }

    catch(e){

      input.select();

      document.execCommand(
        "copy"
      );

    }

  }
);


/* ==================================================
   CLEAR
   ================================================== */

document
.getElementById("clear")
.addEventListener(
  "click",
  function(){

    input.value="";

    render();

    input.focus();

  }
);


/* ==================================================
   サンプル
   ================================================== */

document
.getElementById("sampleYuzuki")
.addEventListener(
  "click",
  function(){

    input.value =
    '<i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i>';

    render();

  }
);


document
.getElementById("sampleYuzuki3")
.addEventListener(
  "click",
  function(){

    input.value =
    '\\ua<i><size=60><color=#9ff>　꙰♡✺꙰\\ua👏ゆ⃟ず⃟き⃟👏\\ua　꙰♡✺꙰</color></size></i>';

    render();

  }
);


/* ==================================================
   START
   ================================================== */

render();

</script>

</body>
</html>
