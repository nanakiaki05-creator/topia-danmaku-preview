<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v6</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#101116;
  --panel:#1b1d26;
  --panel2:#171920;
  --border:#414451;
  --text:#fff;
  --sub:#999;
  --pink:#ff86b4;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Sans","Yu Gothic",sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:5px 0;
  font-size:24px;
}

.sub{
  margin:5px 0 16px;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

textarea{
  width:100%;
  height:170px;
  padding:14px;
  background:var(--panel);
  color:#fff;
  border:1px solid #484b57;
  border-radius:14px;
  font-size:16px;
  line-height:1.5;
  resize:vertical;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:8px 2px 12px;
  color:#aaa;
  font-size:13px;
}

.warning{color:#ffd166}
.danger{color:#ff7373}

/* =========================
   TOPIA補正スイッチ
========================= */

.modeRow{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0;
}

.switch{
  position:relative;
  display:inline-block;
  width:48px;
  height:27px;
  flex:none;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#444;
  border-radius:30px;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--pink);
}

.switch input:checked + .slider:before{
  transform:translateX(21px);
}

.modeText{
  color:#bbb;
  font-size:14px;
}

/* =========================
   TOPIAプレビュー
========================= */

.stage{
  position:relative;
  width:100%;
  height:250px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;

  background:
  linear-gradient(
    rgba(10,11,15,.45),
    rgba(10,11,15,.45)
  ),
  radial-gradient(
    circle at 20% 30%,
    #45495d,
    transparent 40%
  ),
  radial-gradient(
    circle at 80% 75%,
    #493450,
    transparent 42%
  ),
  #20222c;
}

.stageTitle{
  position:absolute;
  top:10px;
  left:13px;
  color:#aaa;
  font-size:12px;
  z-index:20;
}

#previewViewport{
  position:absolute;
  left:14px;
  right:14px;
  top:40px;
  bottom:10px;
  overflow:visible;
}

#preview{
  position:absolute;
  left:0;
  top:50%;
  transform-origin:left center;
  white-space:nowrap;
  text-align:left;

  text-shadow:
  0 2px 3px rgba(0,0,0,.9),
  0 0 5px rgba(255,255,255,.08);
}

.uaBreak{
  display:block;
  height:0;
}

/* =========================
   Unicode
========================= */

.specialEffect{
  display:inline;
}

.scatterEffect{
  display:inline;
}

/*
  補正ON時。

  ここでは字形を作り直さず、
  全体の詰まり方だけを調整。
*/

.topiaCorrection{
  font-feature-settings:"kern" 1;
}

/* =========================
   調整パネル
========================= */

.adjustPanel{
  margin-top:14px;
  padding:14px;
  background:var(--panel2);
  border:1px solid #30333d;
  border-radius:14px;
}

.adjustTitle{
  margin-bottom:4px;
  font-size:15px;
  font-weight:bold;
}

.adjustSub{
  margin-bottom:14px;
  color:#888;
  font-size:12px;
  line-height:1.6;
}

.control{
  margin:14px 0;
}

.controlTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  color:#bbb;
  font-size:13px;
}

.controlValue{
  color:#ff9fc3;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  width:100%;
  accent-color:#ff86b4;
}

.reset{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#432f38;
  color:#ffb5cf;
  font-size:14px;
  font-weight:bold;
}

/* =========================
   ボタン
========================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.buttons button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
}

.copy{
  background:#ff8eb8;
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}

/* =========================
   サンプル
========================= */

.samples{
  margin-top:18px;
  padding:14px;
  background:#181a22;
  border:1px solid #30323c;
  border-radius:14px;
}

.samplesTitle{
  margin-bottom:10px;
  font-size:14px;
  font-weight:bold;
}

.sample{
  width:100%;
  margin-top:7px;
  padding:11px;
  background:#292c37;
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:14px;
}

.note{
  margin-top:15px;
  color:#888;
  font-size:12px;
  line-height:1.7;
}

@media(max-width:500px){

  main{padding:16px}

  h1{font-size:23px}

  .stage{height:235px}

}
</style>
</head>

<body>

<main>

<h1>✨ トピア弾幕プレビュー v6</h1>

<div class="sub">
弾幕作成＋TOPIA実機表示キャリブレーション
</div>

<textarea
id="code"
spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>

<div class="info">
  <span id="counter">推定：0 / 50</span>
  <span id="warning"></span>
</div>

<div class="modeRow">

<label class="switch">
  <input type="checkbox" id="correction" checked>
  <span class="slider"></span>
</label>

<span class="modeText">
TOPIA実機補正
</span>

</div>

<div class="stage">

<div class="stageTitle">
TOPIA実機風プレビュー
</div>

<div id="previewViewport">
  <div id="preview"></div>
</div>

</div>

<!-- 調整 -->

<div class="adjustPanel">

<div class="adjustTitle">
🎛 TOPIA表示調整
</div>

<div class="adjustSub">
実機スクショと見比べながら調整してください。
設定はこのSafariに保存されます。
</div>

<!-- 全体倍率 -->

<div class="control">

<div class="controlTop">
  <span>全体倍率</span>
  <span class="controlValue" id="scaleValue"></span>
</div>

<input
type="range"
id="scale"
min="0.50"
max="1.50"
step="0.01"
>

</div>

<!-- 横倍率 -->

<div class="control">

<div class="controlTop">
  <span>横倍率</span>
  <span class="controlValue" id="scaleXValue"></span>
</div>

<input
type="range"
id="scaleX"
min="0.50"
max="1.50"
step="0.01"
>

</div>

<!-- 縦倍率 -->

<div class="control">

<div class="controlTop">
  <span>縦倍率</span>
  <span class="controlValue" id="scaleYValue"></span>
</div>

<input
type="range"
id="scaleY"
min="0.50"
max="1.50"
step="0.01"
>

</div>

<!-- 文字間隔 -->

<div class="control">

<div class="controlTop">
  <span>文字間隔</span>
  <span class="controlValue" id="spacingValue"></span>
</div>

<input
type="range"
id="spacing"
min="-20"
max="20"
step="1"
>

</div>

<!-- 重なり -->

<div class="control">

<div class="controlTop">
  <span>特殊文字の重なり</span>
  <span class="controlValue" id="overlapValue"></span>
</div>

<input
type="range"
id="overlap"
min="-30"
max="20"
step="1"
>

</div>

<!-- 上下 -->

<div class="control">

<div class="controlTop">
  <span>上下位置</span>
  <span class="controlValue" id="yValue"></span>
</div>

<input
type="range"
id="yPosition"
min="-60"
max="60"
step="1"
>

</div>

<button
class="reset"
id="reset"
>
調整値をリセット
</button>

</div>

<div class="buttons">

<button class="copy" id="copy">
コードをコピー
</button>

<button class="clear" id="clear">
クリア
</button>

</div>

<div class="samples">

<div class="samplesTitle">
実機比較サンプル
</div>

<button class="sample" id="sampleYuzuki">
🩵 ゆずき特殊文字
</button>

<button class="sample" id="sampleThree">
🩵 ゆずき3段
</button>

<button class="sample" id="sampleScatter">
✨ ꙰♡✺꙰
</button>

<button class="sample" id="sampleDiamond">
💎 ⃟ 結合文字
</button>

</div>

<div class="note">
文字数はTOPIAで確認できた「全角50文字以内」を基準にした推定値です。
半角・タグ・特殊Unicodeの正確な換算方法は未確定なので目安として使用してください。
</div>

</main>

<script>

/* =========================
   DOM
========================= */

const input =
document.getElementById("code");

const preview =
document.getElementById("preview");

const correction =
document.getElementById("correction");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");


/* =========================
   調整値
========================= */

const defaults={
  scale:1,
  scaleX:1,
  scaleY:1,
  spacing:0,
  overlap:0,
  y:0
};

let settings={};

for(const key in defaults){

  const stored=
  localStorage.getItem(
    "topiaV6_"+key
  );

  settings[key]=
  stored===null
  ? defaults[key]
  : Number(stored);

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(text){

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


/* =========================
   COLOR
========================= */

function safeColor(color){

  color=color.trim();

  if(
    /^#[0-9a-f]{3}$/i.test(color)
    ||
    /^#[0-9a-f]{6}$/i.test(color)
  ){
    return color;
  }

  return "#fff";

}


/* =========================
   SIZE
========================= */

function sizeToPx(size){

  size=Number(size);

  if(!Number.isFinite(size)){
    size=40;
  }

  let px=size*0.82;

  if(px<8)px=8;
  if(px>140)px=140;

  return px;

}


/* =========================
   TOKENIZER
========================= */

function tokenize(text){

  const regex=
  /(\\ua|<\/?b>|<\/?i>|<size=[^>]+>|<\/size>|<color=[^>]+>|<\/color>)/gi;

  const tokens=[];

  let last=0;
  let match;

  while(
    (match=regex.exec(text))!==null
  ){

    if(match.index>last){

      tokens.push({
        type:"text",
        value:text.slice(
          last,
          match.index
        )
      });

    }

    tokens.push({
      type:"tag",
      value:match[0]
    });

    last=regex.lastIndex;

  }

  if(last<text.length){

    tokens.push({
      type:"text",
      value:text.slice(last)
    });

  }

  return tokens;

}


/* =========================
   特殊Unicode
========================= */

function specialText(text){

  let safe=
  escapeHTML(text);

  /*
    TOPIAとSafariで差が大きい
    既知パターン。

    Unicode列そのものは
    書き換えない。
  */

  safe=safe.replace(
    /᭄/g,
    '<span class="specialEffect">᭄</span>'
  );

  safe=safe.replace(
    /ꦿૢ₈⁸/g,
    '<span class="specialEffect">ꦿૢ₈⁸</span>'
  );

  safe=safe.replace(
    /꙰♡✺꙰/g,
    '<span class="scatterEffect">꙰♡✺꙰</span>'
  );

  return safe;

}


/* =========================
   PARSER
========================= */

function parse(text){

  const tokens=
  tokenize(text);

  let html="";

  for(const token of tokens){

    if(token.type==="text"){

      html+=specialText(
        token.value
      );

      continue;

    }

    const tag=
    token.value;

    const lower=
    tag.toLowerCase();


    /* UA */

    if(lower==="\\ua"){

      html+=
      '<br class="uaBreak">';

      continue;

    }


    /* B */

    if(lower==="<b>"){

      html+="<b>";
      continue;

    }

    if(lower==="</b>"){

      html+="</b>";
      continue;

    }


    /* I */

    if(lower==="<i>"){

      html+="<i>";
      continue;

    }

    if(lower==="</i>"){

      html+="</i>";
      continue;

    }


    /* SIZE */

    if(
      lower.startsWith(
        "<size="
      )
    ){

      const m=
      tag.match(
        /<size=([^>]+)>/i
      );

      const size=
      m ? m[1] : 40;

      html+=
      '<span style="'+
      'font-size:'+
      sizeToPx(size)+
      'px;'+
      'line-height:1;'+
      '">';

      continue;

    }

    if(lower==="</size>"){

      html+="</span>";
      continue;

    }


    /* COLOR */

    if(
      lower.startsWith(
        "<color="
      )
    ){

      const m=
      tag.match(
        /<color=([^>]+)>/i
      );

      const color=
      m
      ? safeColor(m[1])
      : "#fff";

      html+=
      '<span style="color:'+
      color+
      ';">';

      continue;

    }

    if(
      lower==="</color>"
    ){

      html+="</span>";
      continue;

    }

  }

  return html;

}


/* =========================
   文字数推定
========================= */

function estimatedLength(text){

  let total=0;

  for(
    const char
    of Array.from(text)
  ){

    const cp=
    char.codePointAt(0);

    if(cp<=0x7f){
      total+=0.5;
    }
    else{
      total+=1;
    }

  }

  return total;

}


/* =========================
   RENDER
========================= */

function render(){

  preview.innerHTML=
  parse(input.value);

  /*
    TOPIA補正
  */

  if(correction.checked){

    preview.classList.add(
      "topiaCorrection"
    );

  }else{

    preview.classList.remove(
      "topiaCorrection"
    );

  }


  /*
    全体変形
  */

  preview.style.transform=
  "translateY(calc(-50% + "+
  settings.y+
  "px)) "+
  "scale("+
  settings.scale+
  ") "+
  "scaleX("+
  settings.scaleX+
  ") "+
  "scaleY("+
  settings.scaleY+
  ")";


  preview.style.letterSpacing=
  settings.spacing+
  "px";


  /*
    特殊文字の重なり
  */

  document
  .querySelectorAll(
    ".specialEffect"
  )
  .forEach(el=>{

    if(correction.checked){

      el.style.display=
      "inline-block";

      el.style.marginLeft=
      settings.overlap+
      "px";

    }else{

      el.style.display=
      "inline";

      el.style.marginLeft=
      "0";

    }

  });


  updateCounter();
  updateControls();

}


/* =========================
   COUNTER
========================= */

function updateCounter(){

  const value=
  estimatedLength(
    input.value
  );

  const shown=
  Number.isInteger(value)
  ? value
  : value.toFixed(1);

  counter.textContent=
  "推定："+
  shown+
  " / 50";


  if(value>50){

    warning.textContent=
    "⚠ 上限超過の可能性";

    warning.className=
    "danger";

  }
  else if(value>=45){

    warning.textContent=
    "⚠ 上限付近";

    warning.className=
    "warning";

  }
  else{

    warning.textContent="";

  }

}


/* =========================
   CONTROL
========================= */

const controls={

  scale:
  document.getElementById(
    "scale"
  ),

  scaleX:
  document.getElementById(
    "scaleX"
  ),

  scaleY:
  document.getElementById(
    "scaleY"
  ),

  spacing:
  document.getElementById(
    "spacing"
  ),

  overlap:
  document.getElementById(
    "overlap"
  ),

  y:
  document.getElementById(
    "yPosition"
  )

};


const displays={

  scale:
  document.getElementById(
    "scaleValue"
  ),

  scaleX:
  document.getElementById(
    "scaleXValue"
  ),

  scaleY:
  document.getElementById(
    "scaleYValue"
  ),

  spacing:
  document.getElementById(
    "spacingValue"
  ),

  overlap:
  document.getElementById(
    "overlapValue"
  ),

  y:
  document.getElementById(
    "yValue"
  )

};


function updateControls(){

  controls.scale.value=
  settings.scale;

  controls.scaleX.value=
  settings.scaleX;

  controls.scaleY.value=
  settings.scaleY;

  controls.spacing.value=
  settings.spacing;

  controls.overlap.value=
  settings.overlap;

  controls.y.value=
  settings.y;


  displays.scale.textContent=
  Math.round(
    settings.scale*100
  )+"%";

  displays.scaleX.textContent=
  Math.round(
    settings.scaleX*100
  )+"%";

  displays.scaleY.textContent=
  Math.round(
    settings.scaleY*100
  )+"%";

  displays.spacing.textContent=
  settings.spacing+"px";

  displays.overlap.textContent=
  settings.overlap+"px";

  displays.y.textContent=
  settings.y+"px";

}


for(const key in controls){

  controls[key]
  .addEventListener(
    "input",
    function(){

      settings[key]=
      Number(
        this.value
      );

      localStorage.setItem(
        "topiaV6_"+key,
        settings[key]
      );

      render();

    }
  );

}


/* =========================
   RESET
========================= */

document
.getElementById(
  "reset"
)
.addEventListener(
  "click",
  function(){

    settings={
      ...defaults
    };

    for(
      const key
      in settings
    ){

      localStorage.setItem(
        "topiaV6_"+key,
        settings[key]
      );

    }

    render();

  }
);


/* =========================
   INPUT
========================= */

input.addEventListener(
  "input",
  render
);

correction.addEventListener(
  "change",
  render
);


/* =========================
   COPY
========================= */

document
.getElementById(
  "copy"
)
.addEventListener(
  "click",
  async function(){

    try{

      await navigator.clipboard
      .writeText(
        input.value
      );

      this.textContent=
      "コピーしました ✓";

      const button=this;

      setTimeout(
        function(){

          button.textContent=
          "コードをコピー";

        },
        1200
      );

    }
    catch(e){

      input.select();

      document.execCommand(
        "copy"
      );

    }

  }
);


/* =========================
   CLEAR
========================= */

document
.getElementById(
  "clear"
)
.addEventListener(
  "click",
  function(){

    input.value="";

    render();

    input.focus();

  }
);


/* =========================
   SAMPLES
========================= */

document
.getElementById(
  "sampleYuzuki"
)
.addEventListener(
  "click",
  function(){

    input.value=
    '<i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleThree"
)
.addEventListener(
  "click",
  function(){

    input.value=
    '\\ua<i><size=60><color=#9ff>　꙰♡✺꙰\\ua👏ゆ⃟ず⃟き⃟👏\\ua　꙰♡✺꙰</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleScatter"
)
.addEventListener(
  "click",
  function(){

    input.value=
    '\\ua<i><size=60><color=#9ff>꙰♡✺꙰</color></size></i>';

    render();

  }
);


document
.getElementById(
  "sampleDiamond"
)
.addEventListener(
  "click",
  function(){

    input.value=
    '\\ua<size=60><color=#9ff>👏ゆ⃟ず⃟き⃟👏</color></size>';

    render();

  }
);


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
