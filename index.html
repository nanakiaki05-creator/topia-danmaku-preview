<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v10</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#101116;
  color:#fff;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Hiragino Kaku Gothic ProN",
    "Noto Sans JP",
    sans-serif;
}

main{
  width:100%;
  max-width:800px;
  margin:auto;
  padding:18px;
}

h1{
  margin:6px 0;
  font-size:25px;
}

.sub{
  margin:0 0 18px;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

textarea{
  display:block;
  width:100%;
  height:180px;
  resize:vertical;

  padding:15px;

  background:#1b1d26;
  color:#fff;

  border:1px solid #555966;
  border-radius:15px;

  font-family:inherit;
  font-size:16px;
  line-height:1.55;

  outline:none;
}

textarea:focus{
  border-color:#ff82b2;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;

  min-height:48px;

  padding:8px 3px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.stage{
  position:relative;

  width:100%;
  height:380px;

  overflow:hidden;

  border:1px solid #444856;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 12% 12%,
      rgba(70,78,108,.45),
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(73,46,87,.35),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #222532,
      #14151c
    );
}

.stageTitle{
  position:absolute;
  top:13px;
  left:14px;

  z-index:10;

  color:#999;
  font-size:12px;
}

/*
  TOPIA表示領域

  v10では中央揃えにしない。
  TOPIAスクショと同じく、
  左側から文字列を構成する。
*/
#preview{
  position:absolute;

  left:42px;
  top:105px;

  white-space:nowrap;

  transform-origin:left center;

  font-size:40px;
  line-height:1;

  text-shadow:
    0 3px 2px rgba(0,0,0,.85),
    0 0 2px rgba(0,0,0,.55);
}

/*
  通常文字
*/
.unit{
  position:relative;
  display:inline-block;

  vertical-align:baseline;

  transform-origin:center center;
}

/*
  italic
*/
.topia-i{
  font-style:italic;
}

/*
  bold
*/
.topia-b{
  font-weight:700;
}


/* =========================
   TOPIA特殊文字補正
   ========================= */

/*
  ᭄

  TOPIA実機では通常のSafari表示より
  大きく縦方向へ展開して見えるため、
  専用補正を行う。
*/
.fx-long{
  position:relative;

  display:inline-block;

  width:.80em;

  margin-left:-.20em;
  margin-right:-.05em;

  transform:
    translateY(.08em)
    scaleX(.82)
    scaleY(1.25);

  transform-origin:center center;

  z-index:2;
}


/*
  ꦿૢ

  TOPIAでは直前の᭄へ重なるように
  描画される傾向を再現。
*/
.fx-cluster{
  position:relative;

  display:inline-block;

  margin-left:-.48em;

  transform:
    translateY(.18em)
    scaleX(.90)
    scaleY(1.02);

  transform-origin:left center;

  z-index:3;
}


/*
  上付き・下付き数字
*/
.fx-super{
  position:relative;

  display:inline-block;

  margin-left:-.16em;

  transform:
    translateY(-.58em)
    scale(.78);

  transform-origin:left center;

  z-index:5;
}

.fx-sub{
  position:relative;

  display:inline-block;

  margin-left:-.25em;

  transform:
    translateY(.38em)
    scale(.82);

  transform-origin:left center;

  z-index:5;
}


/*
  結合文字系
*/
.fx-combining{
  position:relative;

  display:inline-block;

  margin-left:-.38em;

  transform-origin:center center;

  z-index:4;
}


/*
  改行
*/
.topia-line{
  display:block;
  height:.96em;
}


/* =========================
   ボタン
   ========================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button{
  min-height:52px;

  border:0;
  border-radius:13px;

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

.copy{
  flex:1;
  background:#ff82b2;
  color:#111;
}

.clear{
  flex:1;
  background:#30333f;
  color:#fff;
}


/* =========================
   状態表示
   ========================= */

.status{
  margin-top:16px;

  padding:15px;

  border:1px solid #343744;
  border-radius:16px;

  background:#161820;
}

.statusTitle{
  margin-bottom:8px;
  font-weight:700;
}

.ok{
  color:#8be9b0;
  font-size:13px;
}

.note{
  margin-top:8px;

  color:#8f919a;
  font-size:12px;
  line-height:1.65;
}


/* =========================
   モバイル
   ========================= */

@media(max-width:500px){

  main{
    padding:16px;
  }

  h1{
    font-size:23px;
  }

  textarea{
    height:170px;
  }

  .stage{
    height:365px;
  }

  #preview{
    left:32px;
    top:105px;
  }
}
</style>
</head>


<body>

<main>

<h1>✨ トピア弾幕プレビュー v10</h1>

<div class="sub">
コードを貼るだけでTOPIA実機の特殊文字配置を自動補正
</div>


<textarea id="code" spellcheck="false"><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>


<div class="info">

<span id="counter">
推定：0 / 50
</span>

<span id="warning"></span>

</div>


<div class="stage">

<div class="stageTitle">
TOPIA実機風プレビュー
</div>

<div id="preview"></div>

</div>


<div class="buttons">

<button
class="copy"
id="copy"
>
コードをコピー
</button>

<button
class="clear"
id="clear"
>
クリア
</button>

</div>


<div class="status">

<div class="statusTitle">
🔬 v10 レンダラー
</div>

<div class="ok">
✓ TOPIA特殊Unicode自動補正 ON
</div>

<div class="note">
᭄・ꦿૢ・上付き/下付き文字・結合文字を通常のSafari描画から分離し、
TOPIA実機スクリーンショットを基準に位置関係を補正します。
</div>

</div>

</main>


<script>

const input =
document.getElementById("code");

const preview =
document.getElementById("preview");

const counter =
document.getElementById("counter");

const warning =
document.getElementById("warning");


/* ======================================
   HTML escape
====================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ======================================
   TOPIA文字数 推定
====================================== */

function estimateLength(str){

  let count=0;

  for(const ch of Array.from(str)){

    const code=
    ch.codePointAt(0);

    /*
      ASCII / 半角
    */
    if(code<=0x7f){

      count+=0.5;

    }else{

      count+=1;

    }

  }

  return Math.round(count*10)/10;

}


/* ======================================
   特殊Unicode判定
====================================== */

function specialClass(text){

  /*
    TOPIAで大きく伸びる文字
  */
  if(text==="᭄"){
    return "fx-long";
  }

  /*
    装飾クラスタ
  */
  if(
    text.includes("ꦿ") ||
    text.includes("ૢ")
  ){
    return "fx-cluster";
  }

  /*
    上付き数字
  */
  if(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/u.test(text)){
    return "fx-super";
  }

  /*
    下付き
  */
  if(/[₀₁₂₃₄₅₆₇₈₉]/u.test(text)){
    return "fx-sub";
  }

  /*
    combining mark
  */
  if(/\p{M}/u.test(text)){
    return "fx-combining";
  }

  return "";

}


/* ======================================
   grapheme分割
====================================== */

function graphemes(text){

  if(
    typeof Intl!=="undefined" &&
    Intl.Segmenter
  ){

    const segmenter=
    new Intl.Segmenter(
      "ja",
      {granularity:"grapheme"}
    );

    return Array.from(
      segmenter.segment(text),
      x=>x.segment
    );

  }

  return Array.from(text);

}


/* ======================================
   通常テキスト描画
====================================== */

function textToHTML(text){

  let html="";

  const chars=
  graphemes(text);

  for(const ch of chars){

    /*
      TOPIA実機用
      特殊クラスタ
    */

    let cls=
    specialClass(ch);

    html+=
    '<span class="unit '+cls+'">'+
    escapeHTML(ch)+
    '</span>';

  }

  return html;

}


/* ======================================
   parser
====================================== */

function parse(raw){

  let output="";

  let last=0;

  const tag=
  /(\\ua|<\/?b>|<\/?i>|<size=([^>]+)>|<\/size>|<color=([^>]+)>|<\/color>)/gi;

  let match;

  while(
    (match=tag.exec(raw))!==null
  ){

    const normalText=
    raw.substring(
      last,
      match.index
    );

    output+=
    textToHTML(normalText);


    const original=
    match[0];

    const lower=
    original.toLowerCase();


    /* \ua */

    if(lower==="\\ua"){

      output+=
      '<span class="topia-line"></span>';

    }


    /* bold */

    else if(lower==="<b>"){

      output+=
      '<span class="topia-b">';

    }

    else if(lower==="</b>"){

      output+=
      "</span>";

    }


    /* italic */

    else if(lower==="<i>"){

      output+=
      '<span class="topia-i">';

    }

    else if(lower==="</i>"){

      output+=
      "</span>";

    }


    /* size */

    else if(
      lower.startsWith("<size=")
    ){

      let size=
      parseFloat(match[2]);

      if(isNaN(size)){
        size=40;
      }

      /*
        v10:
        TOPIA size値をSafari pxへ変換

        size80 → 約64px
        size40 → 約32px
      */

      const px=
      size*0.80;

      output+=
      '<span style="'+
      'font-size:'+px+'px;'+
      'line-height:1;'+
      '">';

    }

    else if(
      lower==="</size>"
    ){

      output+=
      "</span>";

    }


    /* color */

    else if(
      lower.startsWith("<color=")
    ){

      let color=
      match[3];

      if(
        !/^#[0-9a-f]{3,8}$/i.test(color) &&
        !/^[a-z]+$/i.test(color)
      ){

        color="#fff";

      }

      output+=
      '<span style="color:'+
      color+
      '">';

    }

    else if(
      lower==="</color>"
    ){

      output+=
      "</span>";

    }


    last=
    tag.lastIndex;

  }


  output+=
  textToHTML(
    raw.substring(last)
  );


  return output;

}


/* ======================================
   TOPIA実機用追加補正

   DOM生成後に特殊文字同士の
   相対位置を調整する。
====================================== */

function calibrate(){

  const units=
  preview.querySelectorAll(".unit");


  units.forEach(function(el){

    const text=
    el.textContent;


    /*
      ᭄
    */

    if(text==="᭄"){

      el.style.marginLeft=
      "-0.22em";

      el.style.marginRight=
      "-0.08em";

    }


    /*
      ꦿ / ૢ
    */

    if(
      text.includes("ꦿ") ||
      text.includes("ૢ")
    ){

      el.style.marginLeft=
      "-0.52em";

    }

  });


  /*
    連続する上付き数字は
    TOPIA風に階段状へ寄せる
  */

  const supers=
  preview.querySelectorAll(
    ".fx-super"
  );

  supers.forEach(
    function(el,index){

      if(index%2===1){

        el.style.transform=
        "translate(-.18em,.10em) scale(.78)";

      }

    }
  );

}


/* ======================================
   render
====================================== */

function render(){

  const raw=
  input.value;


  if(!raw){

    preview.innerHTML="";

    counter.textContent=
    "推定：0 / 50";

    warning.textContent="";

    return;

  }


  preview.innerHTML=
  parse(raw);


  calibrate();


  const count=
  estimateLength(raw);


  counter.textContent=
  "推定："+count+" / 50";


  if(count>50){

    warning.textContent=
    "⚠ 上限超過";

    warning.className=
    "warning";

  }

  else if(count>=45){

    warning.textContent=
    "⚠ 上限付近";

    warning.className=
    "warning";

  }

  else{

    warning.textContent="";

  }

}


/* ======================================
   events
====================================== */

input.addEventListener(
  "input",
  render
);


/* copy */

document
.getElementById("copy")
.addEventListener(
"click",
async function(){

  const button=this;

  try{

    await navigator
    .clipboard
    .writeText(
      input.value
    );

    button.textContent=
    "コピーしました ✓";

    setTimeout(
      function(){

        button.textContent=
        "コードをコピー";

      },
      1200
    );

  }

  catch(e){

    input.select();

    document.execCommand(
      "copy"
    );

  }

});


/* clear */

document
.getElementById("clear")
.addEventListener(
"click",
function(){

  input.value="";

  render();

  input.focus();

});


/* first render */

render();

</script>

</body>
</html>
