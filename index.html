<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トピア弾幕プレビュー v8</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#101116;
  --panel:#171922;
  --panel2:#1d202b;
  --border:#3d414e;
  --text:#fff;
  --sub:#9ea1aa;
  --pink:#ff83b3;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Hiragino Kaku Gothic ProN",
    "Noto Sans JP",
    sans-serif;
}

main{
  max-width:800px;
  margin:auto;
  padding:22px 16px 60px;
}

h1{
  margin:5px 0 6px;
  font-size:25px;
}

.sub{
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
  margin-bottom:18px;
}

textarea{
  width:100%;
  height:170px;
  resize:vertical;
  background:#1b1d26;
  color:#fff;
  border:1px solid #505462;
  border-radius:16px;
  padding:15px;
  font-size:16px;
  line-height:1.55;
  outline:none;
}

textarea:focus{
  border-color:var(--pink);
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:10px 3px 16px;
  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.danger{
  color:#ff7d8b;
}

/* =========================
   TOPIA風ステージ
========================= */

.stage{
  position:relative;
  height:390px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #454957;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(83,91,125,.40),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(80,55,96,.35),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #222531,
      #15161d
    );
}

.stageTitle{
  position:absolute;
  top:13px;
  left:14px;
  color:#a6a8af;
  font-size:12px;
  z-index:5;
}

.viewport{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

/*
 TOPIAのコメント表示は中央揃えではなく
 左側を基準として横方向へ伸びるように再現。
*/
#preview{
  position:absolute;
  left:28px;
  top:105px;

  display:inline-block;

  white-space:pre;
  text-align:left;

  line-height:1;

  transform-origin:left center;

  text-shadow:
    0 2px 2px rgba(0,0,0,.95),
    0 4px 5px rgba(0,0,0,.55);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

/* 通常文字 */
.normal-char{
  position:relative;
  display:inline-block;
  vertical-align:baseline;
}

/*
 特殊Unicode。

 Safariの通常のUnicode合成に完全依存すると
 TOPIAとの差が大きくなるため、
 特殊文字だけ独立した描画要素として扱う。
*/
.special-char{
  position:relative;
  display:inline-block;
  vertical-align:baseline;
  transform-origin:center center;
}

/* ᭄ */
.fx-ornament-a{
  margin-left:-7px;
  margin-right:-10px;

  transform:
    translate(-2px,8px)
    scaleX(.90)
    scaleY(1.05);
}

/* ꦿૢ */
.fx-ornament-b{
  margin-left:-14px;
  margin-right:-10px;

  transform:
    translate(-4px,9px)
    scaleX(.86)
    scaleY(.92);
}

/* 下付き8 */
.fx-sub8{
  margin-left:-8px;
  margin-right:-5px;

  transform:
    translate(-2px,13px)
    scale(.82);
}

/* 上付き8 */
.fx-super8{
  margin-left:-7px;
  margin-right:-4px;

  transform:
    translate(-1px,-17px)
    scale(.82);
}

/* ⃟ */
.fx-diamond{
  margin-left:-7px;
  margin-right:-7px;

  transform:
    scale(1.18);
}

/* ꙰ */
.fx-dot{
  margin-left:-4px;
  margin-right:-4px;
}

/* =========================
   ボタン
========================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px;
  font-size:15px;
  font-weight:700;
}

.copy{
  flex:1;
  background:var(--pink);
  color:#111;
}

.clear{
  flex:1;
  background:#30333f;
  color:#fff;
}

/* =========================
   詳細設定
========================= */

details{
  margin-top:18px;
  background:var(--panel);
  border:1px solid #373b46;
  border-radius:16px;
  overflow:hidden;
}

summary{
  padding:15px;
  cursor:pointer;
  font-weight:700;
}

.settings{
  padding:0 15px 18px;
}

.setting{
  margin:16px 0;
}

.settingHeader{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  color:#bbb;
  font-size:13px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--pink);
}

.reset{
  width:100%;
  margin-top:8px;
  background:#50323e;
  color:#ff9fc2;
}

/* =========================
   実機確認用
========================= */

.test{
  margin-top:18px;
  background:var(--panel);
  border:1px solid #373b46;
  border-radius:16px;
  padding:15px;
}

.test h2{
  margin:0 0 12px;
  font-size:16px;
}

.sample{
  background:#252834;
  border-radius:12px;
  padding:12px;
  text-align:center;
  margin-top:8px;
  color:#ddd;
}

.note{
  color:#888;
  font-size:12px;
  line-height:1.6;
  margin-top:14px;
}
</style>
</head>

<body>

<main>

<h1>✨ トピア弾幕プレビュー v8</h1>

<div class="sub">
弾幕コードを貼るだけでTOPIA実機風に自動補正
</div>

<textarea
  id="code"
  spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>

<div class="info">
  <span id="counter">推定：0 / 50</span>
  <span id="warning"></span>
</div>

<div class="stage">

  <div class="stageTitle">
    TOPIA実機風プレビュー
  </div>

  <div class="viewport">
    <div id="preview"></div>
  </div>

</div>

<div class="buttons">

  <button class="copy" id="copy">
    コードをコピー
  </button>

  <button class="clear" id="clear">
    クリア
  </button>

</div>

<details>

<summary>
⚙️ 詳細補正
</summary>

<div class="settings">

  <div class="setting">

    <div class="settingHeader">
      <span>全体倍率</span>
      <span id="scaleValue">100%</span>
    </div>

    <input
      id="scale"
      type="range"
      min="70"
      max="140"
      value="100"
      step="1"
    >

  </div>

  <div class="setting">

    <div class="settingHeader">
      <span>左右位置</span>
      <span id="xValue">0px</span>
    </div>

    <input
      id="x"
      type="range"
      min="-100"
      max="100"
      value="0"
      step="1"
    >

  </div>

  <div class="setting">

    <div class="settingHeader">
      <span>上下位置</span>
      <span id="yValue">0px</span>
    </div>

    <input
      id="y"
      type="range"
      min="-100"
      max="100"
      value="0"
      step="1"
    >

  </div>

  <button class="reset" id="reset">
    補正値をリセット
  </button>

</div>

</details>

<div class="test">

<h2>実機確認用コード</h2>

<div class="sample">
ゆずき特殊文字テスト
</div>

<div class="note">
v8では「᭄」「ꦿૢ」「₈」「⁸」「⃟」「꙰」を検出し、
Safari標準描画との差を自動補正します。
詳細補正は通常は触らなくてOKです。
</div>

</div>

</main>

document.getElementById("code");

const preview =
document.getElementById("preview");
