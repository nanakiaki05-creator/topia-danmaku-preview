<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>トピア弾幕プレビュー v9</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#101116;
  --panel:#1b1d26;
  --border:#454957;
  --text:#ffffff;
  --sub:#9da0a9;
  --pink:#ff83b3;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Hiragino Kaku Gothic ProN",
    "Noto Sans JP",
    sans-serif;
}

main{
  width:100%;
  max-width:800px;
  margin:0 auto;
  padding:24px 16px 60px;
}

h1{
  margin:4px 0 5px;
  font-size:25px;
  line-height:1.35;
}

.sub{
  margin-bottom:18px;
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
}

/* =========================
   入力
========================= */

textarea{
  width:100%;
  height:170px;

  resize:vertical;

  padding:15px;

  border:1px solid #505462;
  border-radius:16px;

  outline:none;

  background:var(--panel);
  color:#fff;

  font-family:inherit;
  font-size:16px;
  line-height:1.55;
}

textarea:focus{
  border-color:var(--pink);
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;

  min-height:28px;

  margin:9px 3px 13px;

  color:#aaa;
  font-size:13px;
}

.warning{
  color:#ffd166;
}

.danger{
  color:#ff7d8b;
}


/* =========================
   プレビュー
========================= */

.stage{
  position:relative;

  width:100%;
  height:390px;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:18px;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(80,88,120,.38),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(83,56,98,.32),
      transparent 40%
    ),
    linear-gradient(
      145deg,
      #222531,
      #15161d
    );
}

.stage-title{
  position:absolute;

  top:13px;
  left:14px;

  z-index:20;

  color:#a6a8af;
  font-size:12px;
}

#preview{
  position:absolute;

  left:32px;
  top:125px;

  display:block;

  white-space:pre;

  text-align:left;

  line-height:1;

  transform-origin:left center;

  text-shadow:
    0 2px 2px rgba(0,0,0,.95),
    0 4px 5px rgba(0,0,0,.55);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}


/* =========================
   TOPIA文字
========================= */

.topia-text{
  display:inline;
}


/*
  通常文字はSafariに
  そのまま描画させる
*/

.grapheme{
  position:relative;
}


/*
  ᭄

  TOPIA実機では大きなカーブとして
  前後の文字へ重なって表示される。
*/

.fx-a{
  position:relative;

  display:inline-block;

  width:.62em;

  margin-left:-.13em;
  margin-right:-.15em;

  transform:
    translateY(.10em)
    scaleX(.94)
    scaleY(1.08);

  transform-origin:center;
}


/*
  ꦿૢ

  この2文字は分割せず
  ひとまとまりとして扱う。
*/

.fx-b{
  position:relative;

  display:inline-block;

  width:.68em;

  margin-left:-.18em;
  margin-right:-.12em;

  transform:
    translateY(.08em)
    scaleX(.90)
    scaleY(.98);

  transform-origin:center;
}


/* 下付き8 */

.fx-sub8{
  position:relative;

  display:inline-block;

  margin-left:-.12em;
  margin-right:-.05em;

  transform:
    translateY(.22em)
    scale(.84);

  transform-origin:center;
}


/* 上付き8 */

.fx-super8{
  position:relative;

  display:inline-block;

  margin-left:-.10em;

  transform:
    translateY(-.30em)
    scale(.84);

  transform-origin:center;
}


/*
  ⃟ は結合文字なので
  原則Safariの結合描画を残す
*/

.fx-combine{
  position:relative;
}


/*
  ꙰ も同様
*/

.fx-dot{
  position:relative;
}


/* =========================
   ボタン
========================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button{
  flex:1;

  border:0;
  border-radius:13px;

  padding:14px 10px;

  font-size:15px;
  font-weight:700;
}

.copy{
  background:var(--pink);
  color:#111;
}

.clear{
  background:#30333f;
  color:#fff;
}


/* =========================
   状態表示
========================= */

.status{
  margin-top:18px;

  padding:14px 15px;

  border:1px solid #373b46;
  border-radius:15px;

  background:#171922;
}

.status-title{
  margin-bottom:8px;
  font-weight:700;
}

.status-text{
  color:#999;
  font-size:12px;
  line-height:1.7;
}

.ok{
  color:#8ee6b1;
}

.error{
  color:#ff8c98;
}

</style>
</head>


<body>

<main>

<h1>
✨ トピア弾幕プレビュー v9
</h1>

<div class="sub">
コードを貼るだけでTOPIA実機風にプレビュー
</div>


<textarea
  id="code"
  spellcheck="false"
><i><size=80>ゆ<size=40>ず</size><color=#0FC>᭄</color><color=#9ff>ꦿૢ₈⁸</color></size></i></textarea>


<div class="info">

  <span id="counter">
    推定：0 / 50
  </span>

  <span id="warning"></span>

</div>


<div class="stage">

  <div class="stage-title">
    TOPIA実機風プレビュー
  </div>

  <div id="preview"></div>

</div>


<div class="buttons">

  <button
    class="copy"
    id="copy"
  >
    コードをコピー
  </button>

  <button
    class="clear"
    id="clear"
  >
    クリア
  </button>

</div>


<div class="status">

  <div class="status-title">
    🔎 レンダラー状態
  </div>

  <div
    class="status-text"
    id="status"
  >
    起動中…
  </div>

</div>

</main>


<script>

/* =========================
   DOM
========================= */

const input =
  document.getElementById("code");

const preview =
  document.getElementById("preview");

const counter =
  document.getElementById("counter");

const warning =
  document.getElementById("warning");

const status =
  document.getElementById("status");


/* =========================
   HTML escape
========================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;");

}


/* =========================
   文字分割

   Intl.Segmenter があれば
   grapheme単位。

   なければArray.from。
========================= */

function splitGraphemes(text){

  try{

    if(
      typeof Intl !== "undefined" &&
      typeof Intl.Segmenter !== "undefined"
    ){

      const segmenter =
        new Intl.Segmenter(
          "ja",
          {
            granularity:"grapheme"
          }
        );

      return Array.from(
        segmenter.segment(text),
        function(item){
          return item.segment;
        }
      );

    }

  }

  catch(e){

    console.log(
      "Segmenter fallback",
      e
    );

  }

  return Array.from(text);

}


/* =========================
   TOPIA文字数の目安

   正確な内部仕様ではなく
   実機エラーの
   「全角50文字以内」を
   見るための目安。
========================= */

function topiaLength(text){

  let total=0;

  const chars=
    Array.from(text);

  for(const ch of chars){

    const cp=
      ch.codePointAt(0);

    if(cp<=0x7F){

      total+=0.5;

    }

    else{

      total+=1;

    }

  }

  return Math.round(
    total*10
  )/10;

}


/* =========================
   色チェック
========================= */

function safeColor(color){

  if(
    /^#[0-9a-f]{3}$/i.test(color) ||
    /^#[0-9a-f]{6}$/i.test(color) ||
    /^#[0-9a-f]{8}$/i.test(color)
  ){

    return color;

  }

  return "#ffffff";

}


/* =========================
   特殊文字描画
========================= */

function renderGrapheme(g){

  /*
    ꦿૢ は必ずセットで優先
  */

  if(g==="ꦿૢ"){

    return (
      '<span class="fx-b">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  if(g==="᭄"){

    return (
      '<span class="fx-a">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  if(g==="₈"){

    return (
      '<span class="fx-sub8">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  if(g==="⁸"){

    return (
      '<span class="fx-super8">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  /*
    結合文字を含む場合は
    分解せずそのまま表示
  */

  if(g.includes("⃟")){

    return (
      '<span class="fx-combine">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  if(g.includes("꙰")){

    return (
      '<span class="fx-dot">' +
      escapeHTML(g) +
      '</span>'
    );

  }


  return (
    '<span class="grapheme">' +
    escapeHTML(g) +
    '</span>'
  );

}


/* =========================
   テキスト描画
========================= */

function renderPlainText(text){

  /*
    Safariによって
    ꦿૢ が別graphemeになる場合が
    あるので先に保護。
  */

  const TOKEN =
    "\uE000";

  text =
    text.replace(
      /ꦿૢ/g,
      TOKEN
    );

  const graphemes =
    splitGraphemes(text);

  let html="";

  for(const g of graphemes){

    if(g===TOKEN){

      html +=
        renderGrapheme(
          "ꦿૢ"
        );

    }

    else{

      html +=
        renderGrapheme(g);

    }

  }

  return html;

}


/* =========================
   TOPIA parser
========================= */

function parseTopia(raw){

  let html="";

  let lastIndex=0;

  /*
    対応：

    \ua
    b
    i
    size
    color
  */

  const regex =
    /(\\ua|<\/?b>|<\/?i>|<size=([^>]+)>|<\/size>|<color=([^>]+)>|<\/color>)/gi;

  let match;


  while(
    (match=regex.exec(raw)) !== null
  ){

    /*
      タグまでの通常文字
    */

    const plain =
      raw.slice(
        lastIndex,
        match.index
      );

    html +=
      renderPlainText(plain);


    const originalTag =
      match[0];

    const lower =
      originalTag.toLowerCase();


    /* =====================
       \ua
    ===================== */

    if(lower==="\\ua"){

      html += "<br>";

    }


    /* =====================
       bold
    ===================== */

    else if(lower==="<b>"){

      html +=
        '<span style="font-weight:700">';

    }

    else if(lower==="</b>"){

      html += "</span>";

    }


    /* =====================
       italic
    ===================== */

    else if(lower==="<i>"){

      html +=
        '<span style="font-style:italic">';

    }

    else if(lower==="</i>"){

      html += "</span>";

    }


    /* =====================
       size
    ===================== */

    else if(
      lower.startsWith("<size=")
    ){

      let size =
        parseFloat(match[2]);

      if(
        !Number.isFinite(size)
      ){

        size=40;

      }

      /*
        v9基準。

        size値をWebのpxへ
        ほぼ1:1で変換。
      */

      const px =
        Math.max(
          8,
          Math.min(
            size,
            150
          )
        );

      html +=
        '<span ' +
        'class="topia-text" ' +
        'style="' +
        'font-size:' +
        px +
        'px;' +
        'line-height:1;' +
        '">';

    }

    else if(
      lower==="</size>"
    ){

      html += "</span>";

    }


    /* =====================
       color
    ===================== */

    else if(
      lower.startsWith("<color=")
    ){

      const color =
        safeColor(
          match[3]
        );

      html +=
        '<span style="color:' +
        color +
        '">';

    }

    else if(
      lower==="</color>"
    ){

      html += "</span>";

    }


    lastIndex =
      regex.lastIndex;

  }


  /*
    最後に残った文字
  */

  html +=
    renderPlainText(
      raw.slice(lastIndex)
    );


  return html;

}


/* =========================
   Render
========================= */

function render(){

  try{

    const raw =
      input.value;


    /*
      先にカウンター。

      parserで何か起きても
      0のままにならない。
    */

    const length =
      topiaLength(raw);

    counter.textContent =
      "推定：" +
      length +
      " / 50";


    if(length>50){

      warning.textContent =
        "⚠ 上限超過";

      warning.className =
        "danger";

    }

    else if(length>=45){

      warning.textContent =
        "⚠ 上限付近";

      warning.className =
        "warning";

    }

    else{

      warning.textContent="";
      warning.className="";

    }


    /*
      空欄
    */

    if(raw.trim()===""){

      preview.innerHTML="";

      status.innerHTML =
        '<span class="ok">' +
        '✓ レンダラー正常' +
        '</span>';

      return;

    }


    /*
      TOPIAコード解析
    */

    const result =
      parseTopia(raw);


    preview.innerHTML =
      result;


    status.innerHTML =
      '<span class="ok">' +
      '✓ v9レンダラー正常' +
      '</span>' +
      '　grapheme解析：ON';


  }

  catch(error){

    /*
      何かあっても
      プレビュー領域を
      完全に無反応にしない。
    */

    console.error(error);

    preview.textContent =
      input.value;

    status.innerHTML =
      '<span class="error">' +
      '⚠ レンダラーエラー：' +
      escapeHTML(
        error.message || String(error)
      ) +
      '</span>';

  }

}


/* =========================
   入力イベント
========================= */

input.addEventListener(
  "input",
  render
);


/* =========================
   Clear
========================= */

document
  .getElementById("clear")
  .addEventListener(
    "click",
    function(){

      input.value="";

      render();

      input.focus();

    }
  );


/* =========================
   Copy
========================= */

document
  .getElementById("copy")
  .addEventListener(
    "click",
    async function(){

      const button=this;

      try{

        await navigator
          .clipboard
          .writeText(
            input.value
          );

        button.textContent =
          "コピーしました ✓";

      }

      catch(error){

        input.focus();

        input.select();

        try{

          document.execCommand(
            "copy"
          );

          button.textContent =
            "コピーしました ✓";

        }

        catch(copyError){

          button.textContent =
            "コピーできませんでした";

        }

      }


      setTimeout(
        function(){

          button.textContent =
            "コードをコピー";

        },
        1200
      );

    }
  );


/* =========================
   起動

   DOM読み込み後なので
   そのままrender可能。
========================= */

render();

</script>

</body>
</html>
